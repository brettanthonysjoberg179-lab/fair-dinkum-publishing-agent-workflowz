const chapters = [{"number": 1, "title": "Chapter 1: Why Aussie Authors Need Their Own Machine", "content": "# Chapter 1: Why Aussie Authors Need Their Own Machine\n\n*The subscription trap, the local-first advantage, and the ebook factory on your laptop.*\n\n---\n\n## The $200-a-month problem\n\nIf you\u2019re an Australian author, small publisher, or content creator, you\u2019ve probably done the math. You sign up for the all-in-one platform. It promises research, writing assistance, cover design, formatting, distribution, marketing copy, and analytics. The first month feels productive. The second month you notice you\u2019re chained to their interface. By the sixth month you\u2019ve spent more than a thousand dollars, your content sits in a cloud database you can\u2019t export cleanly, and the AI suggestions are starting to feel generic because you\u2019re sharing the same model prompts as ten thousand other creators.\n\nThis isn\u2019t a conspiracy. It\u2019s the default business model of modern software: rent your workflow, store your data, and charge you more as your success grows. For a hobbyist that might be fine. For someone building an asset \u2014 a catalogue of ebooks, a newsletter, a brand \u2014 it\u2019s a slow leak of sovereignty.\n\nThe bigger problem isn\u2019t the money. It\u2019s the lock-in. When your entire production pipeline lives inside someone else\u2019s web app, you don\u2019t really own the process. You\u2019re a tenant. If the vendor changes pricing, adds DRM, or shuts down, your workflow collapses.\n\nAustralian creators face an extra layer of friction. Most SaaS tools are built for US and EU users. Time zones, payment methods, tax regimes, and customer support all assume a Northern Hemisphere bias. An Aussie author trying to sell a $4.99 ebook through a global platform often pays higher fees, waits longer for payouts, and wrestles with US-centric dashboards at 2am local time.\n\nWhat if you could own the machine?\n\n---\n\n## A case study in leaving the plantation\n\nConsider the experience of a niche Australian gardening author we\u2019ll call Meg. Meg had built a loyal readership around native plant guides for the Adelaide Hills. She\u2019d published six titles through a popular all-in-one ebook platform. The platform handled formatting, distribution, and marketing. It also took 30% of every sale, limited her export options, and nudged her toward subscription bundles that didn\u2019t match her audience.\n\nWhen Meg decided to leave, she discovered what many creators find too late: her manuscript files were locked in a proprietary format. Her reader data was aggregated into dashboards she couldn\u2019t download. Her cover art was stored in a design tool that required an ongoing subscription just to access the source files. The \u201call-in-one\u201d solution was actually a spiderweb.\n\nMeg spent three months untangling the mess. She rebuilt her files in Markdown, moved her covers to a local design tool, and set up a simple Stripe checkout page. Her costs dropped from $220 a month to under $20 a month. Her royalties went up by 27% because she cut out the middleman. More importantly, she could finally see her complete customer list, segment it, and email it directly.\n\nMeg\u2019s story isn\u2019t unique. It\u2019s the standard arc of creators who realise that renting your creative infrastructure is more expensive than owning it.\n\n---\n\n## The local-first advantage\n\nLocal-first software is a philosophy, not just a technical choice. It means the primary copy of your data lives on your machine. The cloud is optional, used only for backup or collaboration. If the internet cuts out, your workflow continues. If the service shuts down, your files are still there. If you change computers, you copy a folder.\n\nFor authors, this has three concrete benefits:\n\n**1. Data ownership**\nYour manuscripts, outlines, research notes, sales figures, and customer data belong to you. You can back them up to a USB drive, sync them through Dropbox, or store them in your own Obsidian vault. No vendor can hold them hostage.\n\n**2. No rate limits**\nCloud AI APIs throttle you. They have token limits, queue delays, and usage caps. A local-first agent workforce runs on your hardware, on your schedule. You can generate ten chapters overnight without watching a usage meter.\n\n**3. Privacy**\nYour unpublished work, your niche research, your customer emails \u2014 these don\u2019t need to traverse someone else\u2019s servers. Local-first means you decide what leaves your machine and what doesn\u2019t.\n\nThe technical implementation has never been easier. SQLite runs on a single file. FastAPI spins up in seconds. Python scripts automate the boring parts. LLMs run locally through LM Studio or Ollama. You don\u2019t need a data centre. You need a laptop and a clear idea.\n\n---\n\n## What this book will build\n\nBy the time you finish this book, you will have built:\n\n- A FastAPI MCP server that orchestrates 15 specialised AI agents\n- A SQLAlchemy database that tracks every project, opportunity, outline, manuscript, and artifact\n- A Stripe integration that creates products, generates checkout links, and handles webhooks\n- An Obsidian vault workflow that publishes research notes and draft chapters\n- A reproducible, version-controlled, local-first ebook production pipeline\n\nThis isn\u2019t a theory book. Every chapter contains working code, configuration files, and step-by-step instructions. You will run commands, read test output, and ship a real system. The goal isn\u2019t to impress you with abstraction. It\u2019s to give you a machine you can operate, modify, and trust.\n\nThe name of that machine is the Fair Dinkum Publishing Agent Workforce.\n\n---\n\n## What \u201cFair Dinkum\u201d really means\n\nFair dinkum is an Australian phrase that means genuine, authentic, honest. It\u2019s what you say when something is the real deal, not a substitute. We chose it for this project because the ebook automation space is full of hype. SaaS platforms promise AI revolution but deliver leased workflows wrapped in marketing. Open-source projects promise freedom but require a computer science degree to operate.\n\nFair dinkum means building something that works for actual humans. It means transparent pricing, open code, local control, and a workflow that doesn\u2019t require a PhD to understand. It means treating authors as partners, not as recurring revenue streams.\n\n---\n\n## Who this book is for\n\n**The solo author with a series to write**\nYou have ideas, a niche, and a work ethic. You don\u2019t have time to format, research markets, design covers, and write sales copy. This book gives you a team of agents that handle the grunt work while you focus on the creative decisions.\n\n**The small publisher with backlists to digitise**\nYou have print titles, audio rights, or PDFs that need modern ebook treatment. Automating the conversion and formatting pipeline means you can release more titles without hiring more staff.\n\n**The technical founder who wants to ship fast**\nYou\u2019re building a product around ebook creation, publishing, or education. This book gives you a production-ready architecture you can extend, white-label, or embed.\n\n**The privacy-conscious creator**\nYou don\u2019t want your unpublished manuscript in someone else\u2019s cloud. Local-first architecture means your work stays on your machine until you decide otherwise.\n\n**The Australian creator tired of Northern Hemisphere SaaS**\nYou want tools that respect your time zone, your currency, and your customers. You\u2019d rather pay yourself than pay a subscription tax.\n\nThis book assumes you\u2019re comfortable with basic command-line operations and have written code before, even if only in tutorials. You don\u2019t need to be a senior engineer. You need to be curious and persistent.\n\n---\n\n## What you won\u2019t find here\n\nThis book isn\u2019t a get-rich-quick scheme. It won\u2019t teach you to game Amazon algorithms or generate low-quality content farms. The agent workforce is designed for authors who care about craft, accuracy, and long-term brand value.\n\nIt also isn\u2019t a Python textbook. We explain every technical decision in plain English, but we won\u2019t waste pages on syntax you can look up. The code is there to be run, not memorised.\n\nAnd it isn\u2019t locked to one operating system. The examples assume a Linux or macOS terminal, which covers the majority of technical creators. Windows users can adapt the commands through WSL or GitHub Codespaces.\n\n---\n\n## The 15-agent team\n\nBefore we dive into code, let\u2019s meet the workforce. Each agent has a specific job. Together they form a pipeline that takes a niche idea and turns it into a published ebook with sales assets, a Stripe store, and an Obsidian knowledge base.\n\n**Product Director**\nThe project lead. Defines scope, sets milestones, and coordinates the other agents. If the project goes off track, the Product Director spots it first.\n\n**Market Researcher**\nDoes the grunt work of niche analysis: keyword volumes, competitor audits, platform trends, and audience sentiment. This agent turns \u201cI want to write about Australian native plants\u201d into \u201cHere are the twelve specific subtopics people are actually searching for.\u201d\n\n**Opportunity Scorer**\nTakes the research and applies a scoring model. Which niches have enough demand and low enough competition? Which have clear monetisation paths? The Opportunity Scorer ranks options so the Product Director can make an informed decision.\n\n**Positioning Strategist**\nFinds the angle that makes your ebook different from the fifty other books on the same topic. Positioning is about audience, voice, and promise. This agent crafts the one-sentence hook and the three-pillar value proposition.\n\n**Outline Architect**\nBuilds the hierarchical structure: parts, chapters, sections, and key takeaways. A good outline means the Manuscript Author never has to guess what comes next.\n\n**Manuscript Author**\nWrites the actual prose. This agent receives the outline, positioning data, and research notes, then produces draft content chapter by chapter. In production, you\u2019d connect this to a local LLM through LM Studio or an API.\n\n**Editor**\nReviews the manuscript for flow, consistency, and tone. Catches repetition, weak transitions, and passages that don\u2019t match the positioning.\n\n**Fact-Checker**\nVerifies claims, dates, names, and statistics. For Australian content, this agent flags state-specific details, First Nations protocols, and regulatory references.\n\n**Cover Creative Director**\nGenerates the brief for cover design, including dimensions, style keywords, and colour psychology. In a full build, this agent would call an image generation API or produce a specification for a human designer.\n\n**Production Lead**\nAssembles the final ebook files: EPUB, PDF, and Kindle-ready formats. Handles metadata, table of contents, and cover embedding.\n\n**Sales Copywriter**\nWrites the Amazon description, the blurb, the bullet points, and the author bio. This is the packaging that converts browsers into buyers.\n\n**Funnel Builder**\nCreates the sales infrastructure: landing page copy, email sequences, payment link integration, and tokenized download pages. In the Stripe integration, this agent generates the checkout session and webhook handlers.\n\n**Analytics Optimiser**\nSets up tracking, interprets sales data, and suggests A/B tests for titles, prices, and positioning.\n\n**Knowledge Manager**\nPublishes research, outlines, and draft chapters to an Obsidian vault. This gives you a browsable knowledge base that grows with each project.\n\n**Launch Strategist**\nPlans the release calendar, coordinates platform uploads, and manages the first-week promotion push.\n\n---\n\n## The 12-step workflow\n\nHere\u2019s how the agents work together:\n\n1. Product Director defines project parameters\n2. Market Researcher collects niche data\n3. Opportunity Scorer ranks the opportunity\n4. Positioning Strategist finds the angle\n5. Outline Architect builds the structure\n6. Manuscript Author writes the content\n7. Editor polishes the prose\n8. Fact-Checker verifies accuracy\n9. Cover Creative Director designs the visual identity\n10. Production Lead assembles final files\n11. Sales Copywriter and Funnel Builder create sales assets\n12. Analytics Optimiser and Launch Strategist go to market\n\nEach step feeds the next. The database stores every output. The MCP server coordinates execution. The workflow service handles retries, branching, and human-in-the-loop gates.\n\n---\n\n## Why this matters right now\n\nWe\u2019re at an inflection point for independent publishing. AI has made research and drafting faster than ever. Print-on-demand and direct-to-consumer payment infrastructure has made distribution cheaper than ever. The bottleneck is orchestration. Most creators still stitch together SaaS tools manually: a keyword tool, an AI writing assistant, a cover generator, a formatter, a payment processor, an email service.\n\nThat duct-tape stack works until it doesn\u2019t. One API change, one pricing increase, one service shutdown, and you\u2019re back to manual labour.\n\nThe Fair Dinkum Publishing Agent Workforce replaces the duct tape with a programmable machine. You own the code. You control the data. You decide when to upgrade, when to change direction, and when to ship.\n\nThat\u2019s why this book exists. Not to sell you another tool. To help you build your own.\n\n---\n\n## What comes next\n\nIn Chapter 2, we\u2019ll introduce each agent in detail. You\u2019ll learn their inputs, their outputs, and how they fit into the larger pipeline. We\u2019ll also look at the execution patterns: sequential, parallel, and conditional. By the end of Chapter 2, you\u2019ll understand the workforce at a level that lets you modify it without breaking things.\n\nChapter 3 is about the stack. We\u2019ll cover FastAPI, SQLAlchemy, Alembic, Stripe, and Obsidian in enough depth to make informed decisions. You\u2019ll learn why we chose each tool, what alternatives exist, and where the trade-offs are.\n\nThen, in Part 2, we build.\n\n---\n\n*End of Chapter 1*\n"}, {"number": 2, "title": "Chapter 2: Meet Your 15-Skill AI Workforce", "content": "# Chapter 2: Meet Your 15-Skill AI Workforce\n\n*The agent model explained in plain English, the team roster, and why specialists beat generalists.*\n\n---\n\n## The factory metaphor\n\nIf you\u2019ve ever walked through a modern manufacturing plant, you know that no single worker does everything. There are welders, painters, assemblers, quality inspectors, logistics coordinators, and floor managers. Each has a specific role, a specific toolset, and a specific output. When the system works, the car (or the microchip, or the frozen meal) moves from station to station and emerges finished.\n\nAI agents work the same way. A generalist AI \u2014 ChatGPT, Claude, Gemini \u2014 is like a talented temp who can do many tasks but isn\u2019t specialised for any of them. Ask it to write a chapter, and it might forget your tone guidelines. Ask it to format an ebook, and it might hallucinate a CSS rule. Ask it to do both in the same session, and you get inconsistent output.\n\nSpecialist agents are different. Each one is built for one job. The Manuscript Author doesn\u2019t worry about Stripe webhooks. The Fact-Checker doesn\u2019t design covers. The Launch Strategist doesn\u2019t edit prose. This separation of concerns makes the pipeline predictable, testable, and improvable.\n\nIn this chapter, we\u2019ll meet all fifteen agents, understand their interfaces, and see how they chain together.\n\n---\n\n## The base agent: shared DNA\n\nEvery agent in the workforce inherits from `BaseAgent`. This parent class provides common behaviour so the specialists can focus on their actual jobs.\n\n**Project context**\nEvery agent receives a `project_id` on construction. That ID links it to a database record that stores the manuscript, outline, research notes, and artifacts. The agent never has to ask \u201cwhich project am I working on?\u201d \u2014 it knows.\n\n**Logging**\nEvery agent writes structured logs. When something goes wrong, you can trace exactly which agent failed, what input it received, and what output it produced.\n\n**Error handling**\nAgents don\u2019t crash the pipeline. They return structured error responses that the workflow service can catch, retry, or escalate to a human.\n\n**Extensibility**\nWhen you want to add a new agent, you inherit from `BaseAgent`, implement the `execute()` method, and register it in the workflow service. You don\u2019t rewrite the whole system.\n\nThe base agent is the skeleton. The specialists are the organs.\n\n---\n\n## The team roster\n\n### 1. Product Director\n**Role:** Project lead and coordinator\n**Input:** Project brief, niche, target audience\n**Output:** Project plan, milestone list, agent dispatch schedule\n**Why it exists:** Without someone setting scope and tracking progress, the other agents work in chaos. The Product Director ensures the manuscript matches the outline, the cover matches the positioning, and the sales copy matches the manuscript.\n\n**Real-world analogy:** A film director who doesn\u2019t act or operate the camera but makes sure every department delivers something that fits the final cut.\n\n---\n\n### 2. Market Researcher\n**Role:** Niche intelligence and keyword analysis\n**Input:** Broad topic or niche area\n**Output:** Keyword list, competitor summary, audience signals, platform trends\n**Why it exists:** Authors guess what readers want, and they\u2019re usually wrong. The Market Researcher turns intuition into data. It finds the specific subtopics people search for, the gaps in existing books, and the language the audience uses.\n\n**Real-world analogy:** A mining geologist who surveys the land before the miners move in. The minerals are the keywords; the geologist tells you where to dig.\n\n---\n\n### 3. Opportunity Scorer\n**Role:** Niche ranking and go/no-go recommendation\n**Input:** Research data, scoring weights\n**Output:** Ranked niche list with scores for demand, competition, monetisation fit, and production effort\n**Why it exists:** You might have five viable niche ideas. The Opportunity Scorer tells you which one to start with. It removes ego from the decision and replaces it with a repeatable model.\n\n**Real-world analogy:** A talent scout who watches fifty players and recommends the one most likely to succeed in your system.\n\n---\n\n### 4. Positioning Strategist\n**Role:** Differentiation and value proposition\n**Input:** Niche, audience data, competitor analysis\n**Output:** One-sentence hook, three-pillar value proposition, tone guidelines, audience avatar\n**Why it exists:** Fifty books exist on Australian native plants. Yours needs a reason to exist beyond \u201cI wrote another one.\u201d Positioning finds the angle \u2014 backyard growers, restoration professionals, school teachers \u2014 and locks the tone.\n\n**Real-world analogy:** A brand strategist who helps a new coffee shop decide whether it\u2019s the affordable commuter spot, the premium single-origin experience, or the community hub.\n\n---\n\n### 5. Outline Architect\n**Role:** Structural blueprint for the manuscript\n**Input:** Positioning data, research notes, target length\n**Output:** Hierarchical outline with parts, chapters, sections, and key takeaways\n**Why it exists:** Writing without an outline is like building a house without a plan. The Outline Architect ensures logical flow, appropriate pacing, and coverage of all key points. The Manuscript Author just follows the blueprint.\n\n**Real-world analogy:** An architect who draws the blueprints. The builder (Manuscript Author) doesn\u2019t decide where the walls go.\n\n---\n\n### 6. Manuscript Author\n**Role:** Long-form content generation\n**Input:** Outline, research notes, positioning data, tone guidelines\n**Output:** Draft chapters in Markdown\n**Why it exists:** This is the workforce\u2019s writer. It takes the structure and fills it with prose. In production, you connect this agent to a local LLM through LM Studio or an API. The agent handles prompt construction, context management, and chapter-by-chapter generation.\n\n**Real-world analogy:** A copywriter who receives a detailed brief and returns draft copy. They don\u2019t set strategy; they execute the plan.\n\n---\n\n### 7. Editor\n**Role:** Polish and consistency review\n**Input:** Draft manuscript, positioning data, style guide\n**Output:** Revised manuscript with notes, or a list of issues for human review\n**Why it exists:** First drafts are messy. The Editor catches repetition, weak transitions, tone drift, and passages that don\u2019t match the positioning. It doesn\u2019t rewrite creatively \u2014 it refines what\u2019s there.\n\n**Real-world analogy:** A sub-editor at a publishing house who marks up the manuscript before it goes to the author for final approval.\n\n---\n\n### 8. Fact-Checker\n**Role:** Accuracy and compliance verification\n**Input:** Manuscript, research sources, compliance checklist\n**Output:** Verification report with flagged claims, corrections, and source citations\n**Why it exists:** Nonfiction lives or dies by accuracy. The Fact-Checker verifies dates, names, statistics, regulatory references, and cultural protocols. For Australian content, this includes state-specific legislation, First Nations attribution, and biosecurity rules.\n\n**Real-world analogy:** A legal researcher who checks that a published article doesn\u2019t contain libellous or incorrect statements.\n\n---\n\n### 9. Cover Creative Director\n**Role:** Visual identity and cover brief\n**Input:** Title, positioning data, genre conventions, platform specs\n**Output:** Cover brief, style keywords, colour palette, typography notes, image generation prompts\n**Why it exists:** Readers judge books by covers. This agent doesn\u2019t necessarily generate the final image \u2014 it produces the specification that a designer or image generation tool can execute. The brief ensures the cover matches the positioning and meets Amazon, Apple Books, and Kobo requirements.\n\n**Real-world analogy:** An art director who sketches the concept and writes the designer\u2019s notes, but doesn\u2019t necessarily paint the cover themselves.\n\n---\n\n### 10. Production Lead\n**Role:** Final file assembly and formatting\n**Input:** Final manuscript, cover asset, metadata\n**Output:** EPUB, PDF, and Kindle-ready files with embedded metadata and table of contents\n**Why it exists:** A manuscript is not an ebook. The Production Lead handles the messy details: file formats, embedded fonts, hyperlinked tables of contents, ISBN placement, and platform-specific quirks.\n\n**Real-world analogy:** A prepress technician who takes the designer\u2019s files and the editor\u2019s final copy and produces the print-ready PDF.\n\n---\n\n### 11. Sales Copywriter\n**Role:** Marketing copy and packaging\n**Input:** Manuscript summary, positioning data, competitor blurbs\n**Output:** Amazon description, back-cover blurb, bullet points, author bio, series description\n**Why it exists:** The best ebook in the world won\u2019t sell if the description is boring. The Sales Copywriter writes the words that convert browsers into buyers. It studies competitor copy, tests angles, and produces platform-ready text.\n\n**Real-world analogy:** A direct-response copywriter who writes the product page that makes someone click \u201cBuy Now.\u201d\n\n---\n\n### 12. Funnel Builder\n**Role:** Sales infrastructure and delivery automation\n**Input:** Sales copy, pricing, Stripe config\n**Output:** Landing page copy, email sequences, payment link, tokenized download page, webhook handlers\n**Why it exists:** You need a place to sell the book and a way to deliver it. The Funnel Builder creates the assets and configuration for a complete sales funnel: a simple landing page, a Stripe checkout session, a tokenized download link that expires after 72 hours, and the webhook logic that updates customer status.\n\n**Real-world analogy:** A systems integrator who wires together the payment processor, the download server, and the email responder so the customer gets what they paid for without manual intervention.\n\n---\n\n### 13. Analytics Optimiser\n**Role:** Performance tracking and optimisation\n**Input:** Sales data, funnel metrics, customer feedback\n**Output:** Revenue reports, A/B test recommendations, churn analysis\n**Why it exists:** Publishing isn\u2019t a one-and-done event. The Analytics Optimiser tracks what\u2019s working, flags underperforming titles, suggests price changes, and recommends new angles based on actual customer behaviour.\n\n**Real-world analogy:** A business analyst who reads the spreadsheet and tells the team which products to double down on.\n\n---\n\n### 14. Obsidian Knowledge Manager\n**Role:** Vault publishing and knowledge management\n**Input:** Research notes, outlines, draft chapters, fact-check reports\n**Output:** Markdown files in an Obsidian vault with tags, links, and folder structure\n**Why it exists:** Your research and drafts are valuable assets beyond a single ebook. The Knowledge Manager publishes them to an Obsidian vault so you can cross-link ideas, reuse content, and build a personal knowledge base that grows with every project.\n\n**Real-world analogy:** A librarian who catalogs the research so the next author on the team can find it instantly.\n\n---\n\n### 15. Launch Strategist\n**Role:** Release planning and first-week promotion\n**Input:** Final ebook, sales assets, pricing, target audience\n**Output:** Release calendar, platform checklist, email sequence, social media posts, early-reviewer list\n**Why it exists:** A book that launches invisibly sells invisibly. The Launch Strategist plans the first week: which platforms get the book, who receives advance copies, what emails go out when, and how to turn launch momentum into ongoing sales.\n\n**Real-world analogy:** A publicist who coordinates the book tour, the press releases, and the launch party.\n\n---\n\n## How agents communicate\n\nAgents don\u2019t pass messages by yelling across the room. They pass data through the project database. Here\u2019s the flow:\n\n1. **Product Director** creates a project record with status `briefed`.\n2. **Market Researcher** saves keyword and competitor data to the `opportunity` table.\n3. **Opportunity Scorer** reads that data, calculates scores, and updates the project with `positioning_ready`.\n4. **Positioning Strategist** writes the positioning statement and updates the project with `outline_ready`.\n5. **Outline Architect** builds the outline and saves chapters to the `outline` and `chapter` tables.\n6. **Manuscript Author** reads the outline, writes sections, and saves them to the `manuscript` and `section` tables.\n7. **Editor** and **Fact-Checker** read the manuscript, add notes, and update status to `polished`.\n8. **Cover Creative Director** saves the brief and generated assets to the `artifact` table.\n9. **Production Lead** assembles the final files and updates `ebook_path`.\n10. **Sales Copywriter** saves copy to the `artifact` table.\n11. **Funnel Builder** creates the Stripe products and saves the checkout URL to `stripe_payment_link`.\n12. **Analytics Optimiser** reads sales data and produces optimisation reports.\n13. **Obsidian Knowledge Manager** publishes research and drafts to the vault.\n14. **Launch Strategist** coordinates the release and updates the project status to `launched`.\n\nThe workflow service (`app/services/workflow.py`) runs this sequence. It calls each agent\u2019s `execute()` method, passes the project ID, and checks the returned status. If an agent returns an error, the workflow pauses and waits for human intervention.\n\n---\n\n## Why fifteen and not three\n\nYou could ask: why not one \u201csuper agent\u201d that does everything? The answer is reliability, testability, and cost.\n\n**Reliability:** When one agent has one job, it\u2019s easier to make it good. The Fact-Checker doesn\u2019t need to know how to write a cover brief. It just needs to verify claims. Narrow scope means fewer failure modes.\n\n**Testability:** You can write a test for the Fact-Checker that gives it a manuscript with a deliberate error and checks that it flags it. You can\u2019t write that test if the Fact-Checker is bundled inside a generalist that also writes poetry.\n\n**Cost:** Local LLMs have limited context windows. An agent that handles only one task needs a smaller prompt and produces smaller outputs. That means faster inference, lower memory usage, and cheaper API bills if you\u2019re using a cloud model.\n\n**Maintainability:** When you want to improve the Editor, you change one file. You don\u2019t risk breaking the Sales Copywriter or the Outline Architect.\n\nFifteen agents sounds like a lot. In practice, it\u2019s just a clean folder structure and a consistent interface. You can start with five agents and add the rest as you need them.\n\n---\n\n## The agent interface contract\n\nEvery agent implements the same `execute()` signature. This consistency is what makes the pipeline work.\n\n```python\ndef execute(self, **kwargs) -> dict:\n    \"\"\"\n    Run the agent's core logic.\n    \n    Returns a dict with at least:\n    - status: \"success\" or \"error\"\n    - message: human-readable summary\n    - data: optional structured result\n    \"\"\"\n```\n\nThe workflow service doesn\u2019t need to know what each agent does internally. It just calls `execute()`, checks the `status`, and moves to the next agent. This is the open/closed principle: open for extension, closed for modification. You can add new agents without changing the workflow engine.\n\n---\n\n## Running the workforce locally\n\nBefore we build each agent in detail, let\u2019s see the whole team in action. The project includes a test suite that exercises the workflow service. You don\u2019t need to write any code yet.\n\n```bash\ncd ~/fair-dinkum-publishing-agent-workforce\npython3 -m pytest tests/test_workflow.py -v\n```\n\nThis runs through the full pipeline in mock mode. Each agent receives test data, processes it, and returns a result. You\u2019ll see the project status transition from `briefed` to `launched`. If any agent fails, the test stops and reports the error.\n\nThis is your safety net. As you modify agents, the tests tell you whether you broke something.\n\n---\n\n## The mock vs live decision\n\nBy default, the agents run in mock mode. They return simulated data without calling external APIs. This is intentional. You should understand the workflow, verify the tests pass, and only then connect live services.\n\nWhen you\u2019re ready to go live, you change environment variables:\n\n```bash\nexport LLM_PROVIDER=lmstudio\nexport LLM_BASE_URL=http://localhost:1234/v1\nexport LLM_API_KEY=lm-studio\nexport STRIPE_SECRET_KEY=sk_live_...\nexport STRIPE_WEBHOOK_SECRET=whsec_...\nexport OBSIDIAN_VAULT_PATH=$HOME/Documents/Obsidian\\ Vault\n```\n\nThe agents detect these variables and switch from mock to live execution. The interface doesn\u2019t change. The output format doesn\u2019t change. Only the internal implementation changes.\n\nThis is one of the most important design decisions in the workforce. You can develop and test without spending money on API calls, then flip a switch to production.\n\n---\n\n## Customising the team\n\nYou don\u2019t have to use all fifteen agents. If you\u2019re writing fiction, you might skip the Fact-Checker and add a Sensitivity Reader. If you\u2019re publishing technical documentation, you might add a Code Example Validator. If you\u2019re building a series, you might add a Series Continuity Checker.\n\nThe agent system is designed to be modular. Add new agents by creating a new file in `app/agents/`, inheriting from `BaseAgent`, and adding the agent name to the valid list in `app/api/routes.py`. That\u2019s it.\n\nIn Part 3, we\u2019ll show you how to build a custom agent from scratch.\n\n---\n\n## What comes next\n\nNow that you\u2019ve met the team, it\u2019s time to understand the factory floor. Chapter 3 covers the stack: FastAPI, SQLAlchemy, Alembic, Stripe, and Obsidian. You\u2019ll learn why we chose each tool, what alternatives exist, and where the trade-offs are.\n\nThen, in Part 2, we build the brain. You\u2019ll scaffold the workspace, set up the database, create the FastAPI server, and implement the agents one by one.\n\nThe goal isn\u2019t to read about ebook automation. The goal is to own the machine.\n\n---\n\n*End of Chapter 2*\n"}, {"number": 3, "title": "Chapter 3: The Stack That Doesn\u2019t Spy on You", "content": "# Chapter 3: The Stack That Doesn\u2019t Spy on You\n\n*FastAPI, SQLAlchemy, Alembic, Stripe, and Obsidian \u2014 chosen for control, not hype.*\n\n---\n\n## The principles behind the tools\n\nBefore we install anything, let\u2019s establish the criteria that shaped the stack. Every technology in this book was selected because it satisfies at least three of the following:\n\n**1. Local-first**\nRuns on your machine without mandatory cloud dependencies. You can develop offline, deploy offline, and recover from a service shutdown without losing your pipeline.\n\n**2. Open source or transparent pricing**\nYou can inspect the code, audit the dependencies, and understand exactly what you\u2019re paying for. No black boxes, no surprise API changes, no vendor lock-in.\n\n**3. Australian-friendly**\nWorks with AUD pricing, Australian time zones, and local infrastructure. No US-centric dashboards or Northern Hemisphere payment gateways.\n\n**4. Production-ready**\nThis isn\u2019t a weekend project stack. Every tool is used in production systems today. If you outgrow the local setup, you can migrate to a hosted version without rewriting the workflow.\n\n**5. Testable**\nEvery component can be exercised in isolation. You can write tests that verify the database, the API, the agents, and the Stripe integration without touching external services.\n\nThese principles are non-negotiable. If a tool doesn\u2019t pass them, it doesn\u2019t get into the stack.\n\n---\n\n## FastAPI: the orchestration layer\n\nFastAPI is the web framework that powers the MCP server. It\u2019s the interface between you, the agents, and the database.\n\n**Why FastAPI?**\n- **Native async support:** Agent execution is I/O-bound. FastAPI\u2019s async handlers let you run multiple agents concurrently without blocking the event loop.\n- **Automatic documentation:** FastAPI generates OpenAPI docs at `/docs`. You can test every endpoint from a browser without writing a frontend.\n- **Type safety:** Pydantic models define request and response shapes. If an agent returns data in the wrong format, FastAPI catches it before it reaches the client.\n- **Performance:** FastAPI is one of the fastest Python web frameworks. It handles concurrent requests efficiently, which matters when multiple agents hit the database simultaneously.\n\n**What it\u2019s not**\nFastAPI isn\u2019t a job queue. It doesn\u2019t handle long-running tasks like writing a full manuscript in the background. For that, we use the workflow service with explicit state management. FastAPI is the controller, not the worker.\n\n**Alternatives considered**\n- **Flask:** Simpler, but async support requires extensions, and type safety is weaker. Flask is fine for small apps; FastAPI is better for an agent orchestration layer.\n- **Django:** Too heavy. Django includes an ORM, admin panel, and auth system we don\u2019t need. We already use SQLAlchemy directly.\n- **FastMCP:** A specialised MCP framework. We considered it, but it abstracts away too much of the HTTP layer. For learning and debugging, explicit FastAPI routes are clearer.\n\n---\n\n## SQLAlchemy + Alembic: the database backbone\n\nSQLAlchemy is the Python SQL toolkit and ORM. Alembic is its migration tool. Together they form the persistence layer for every project, outline, manuscript, and artifact.\n\n**Why SQLAlchemy?**\n- **Local-first by default:** SQLAlchemy works with SQLite out of the box. No database server to install, no connection strings to manage. You open a file, and you have a database.\n- **Production upgrade path:** When you outgrow SQLite, SQLAlchemy supports PostgreSQL, MySQL, and others with a single line change in the connection string. You don\u2019t rewrite your models.\n- **Query flexibility:** You can write raw SQL when you need performance, or use the ORM when you need convenience. The repository layer gives you both.\n- **Maturity:** SQLAlchemy has been around since 2005. It\u2019s battle-tested, well-documented, and unlikely to disappear.\n\n**Why Alembic?**\nSchema changes happen. You add a column, rename a table, split a model. Without migrations, every team member has a slightly different database schema. Alembic tracks schema versions, generates migration scripts, and applies them in order. It\u2019s like Git for your database.\n\n**The local-first advantage**\nYour entire project database lives in `data/app.db`. Copy that file and you\u2019ve backed up everything: projects, outlines, manuscripts, artifacts, and research notes. No cloud sync required. No export wizard. No vendor dependency.\n\n---\n\n## Stripe: payments without the middleman\n\nStripe is the payment processor. It handles checkout, subscriptions, webhooks, and payouts.\n\n**Why Stripe?**\n- **Australian-friendly:** Stripe supports AUD natively, settles in Australian dollars, and handles GST through tax calculation APIs.\n- **Developer experience:** The Stripe Python library is clean, well-documented, and consistent. Creating a checkout session is a single function call.\n- **Webhook architecture:** Stripe\u2019s webhook system tells you when payments succeed, subscriptions cancel, and invoices fail. You can automate the entire customer lifecycle.\n- **No middleman fees:** By connecting Stripe directly, you avoid platform fees that eat into your margins. A $4.99 ebook through a typical platform might net you $3.50. Direct Stripe checkout can net you $4.70.\n\n**The integration model**\nThe Stripe MCP server wraps the Stripe Python library in MCP tools. The FastAPI app exposes `/stripe/products` and `/stripe/stats` endpoints for quick integration. The Funnel Builder agent calls these endpoints to create products, generate checkout links, and verify webhooks.\n\n**Alternatives considered**\n- **PayPal:** Higher fees, worse API, clunky subscription model.\n- **Square:** Good for physical goods, weaker for digital products and subscriptions.\n- **Paddle:** Acts as a reseller, which adds complexity for tax and compliance.\n- **Crypto:** Interesting for sovereignty, but not practical for mainstream Australian book buyers yet.\n\nStripe is the pragmatic choice. It\u2019s not perfect, but it\u2019s the best available option for digital product sales in 2026.\n\n---\n\n## Obsidian: the knowledge layer\n\nObsidian is a Markdown-based note-taking app. In the workforce, it serves as the publishing target for research notes, outlines, and draft chapters.\n\n**Why Obsidian?**\n- **Markdown-native:** Every agent output is Markdown. Obsidian reads it natively. No conversion, no formatting loss, no proprietary formats.\n- **Local-first:** Your vault lives in a folder on your machine. You can back it up, sync it with Git, or open it in any text editor.\n- **Graph view:** Obsidian\u2019s backlinks and graph view help you see connections between research topics, ebook ideas, and customer data.\n- **Plugin ecosystem:** Obsidian supports community plugins for publishing, task management, and database views. You can extend it without changing the agent code.\n\n**The integration model**\nThe Obsidian Knowledge Manager agent writes Markdown files to a configurable vault path. Each project gets its own folder. Research notes, outlines, chapters, and fact-check reports are saved as individual files with YAML frontmatter for metadata. Obsidian indexes them automatically.\n\n**Alternatives considered**\n- **Notion:** Cloud-first, proprietary format, API rate limits.\n- **Roam Research:** Subscription model, cloud-first, smaller user base.\n- **Plain Markdown folder:** Works, but lacks the backlink graph and plugin ecosystem that make Obsidian useful for knowledge management.\n\n---\n\n## Local LLMs vs cloud APIs\n\nThe Manuscript Author, Editor, and other content agents need a language model. You have two choices: run it locally or call a cloud API.\n\n**Local LLMs with LM Studio or Ollama**\n- **Pros:** No API costs, complete privacy, offline capability, no rate limits.\n- **Cons:** Requires a decent GPU, slower inference on CPU, smaller context windows for consumer hardware.\n- **Best for:** Development, privacy-sensitive content, high-volume generation.\n\n**Cloud APIs (OpenAI, Anthropic, Google)**\n- **Pros:** Best-in-class quality, large context windows, no hardware requirements.\n- **Cons:** Ongoing costs, data leaves your machine, rate limits, dependency on third-party availability.\n- **Best for:** Production workloads where quality matters more than cost.\n\n**The hybrid approach**\nThe workforce supports both. You set `LLM_PROVIDER=lmstudio` for local models or `LLM_PROVIDER=openai` for cloud APIs. The agent code doesn\u2019t change. You flip a switch in `.env`.\n\nFor Australian creators on a budget, local LLMs through LM Studio are the default. A mid-range GPU (RTX 3060 or better) can run 7B\u201313B parameter models at usable speeds. For the best quality, you can pay for API calls on a per-ebook basis.\n\n---\n\n## Docker: one-command deployment\n\nDocker packages the entire workforce \u2014 Python runtime, dependencies, database, and server \u2014 into a single container. You can move it between machines, deploy it to a VPS, or share it with collaborators without environment headaches.\n\n**Why Docker?**\n- **Consistency:** \u201cIt works on my machine\u201d becomes \u201cIt works in the container.\u201d\n- **Isolation:** The container has its own filesystem, network, and dependencies. It doesn\u2019t interfere with your host system.\n- **Portability:** The same Docker image runs on your laptop, a dedicated server, or a cloud VPS.\n- **One command startup:** `docker compose up` starts the FastAPI server, initialises the database, and runs migrations.\n\n**The compose file**\nThe project includes `docker-compose.yml` with two services:\n- `app`: The FastAPI MCP server\n- `db`: PostgreSQL for production (SQLite is used in development)\n\nYou can switch between them by changing the `DATABASE_URL` environment variable.\n\n---\n\n## Security and secrets management\n\nEvery production system needs secrets: Stripe API keys, database passwords, webhook signatures. The workforce handles them through environment variables and `.env` files.\n\n**The rules:**\n1. Never commit secrets to Git. The `.gitignore` file blocks `.env`, `*.key`, and `data/`.\n2. Use `.env.example` as a template. It shows required variables without exposing values.\n3. In production, use a secrets manager or encrypted environment files.\n4. Rotate Stripe webhook secrets and API keys periodically.\n\n**Stripe webhook security**\nThe Stripe MCP server verifies webhook signatures using `STRIPE_WEBHOOK_SECRET`. This ensures that only Stripe can update your customer data. Never disable signature verification in production.\n\n---\n\n## The complete stack diagram\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                  You (the author)                     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                        \u2502 CLI / HTTP\n                        \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502              FastAPI MCP Server                       \u2502\n\u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2502\n\u2502  \u2502 Agent Routes \u2502  \u2502 Project CRUD\u2502  \u2502 Stripe APIs \u2502 \u2502\n\u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2502\n\u2502         \u2502                \u2502                \u2502          \u2502\n\u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u2502\n\u2502  \u2502              Workflow Service                   \u2502  \u2502\n\u2502  \u2502   (orchestrates the 15 agents sequentially)     \u2502  \u2502\n\u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2502\n\u2502         \u2502 dispatches to                            \u2502\n\u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u2502\n\u2502  \u2502              Agent Workforce                    \u2502  \u2502\n\u2502  \u2502  Product Director \u2192 Market Researcher \u2192 ...    \u2502  \u2502\n\u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2502\n\u2502         \u2502 reads/writes                            \u2502\n\u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u2502\n\u2502  \u2502         SQLAlchemy + Alembic                    \u2502  \u2502\n\u2502  \u2502   (SQLite dev, PostgreSQL prod)                 \u2502  \u2502\n\u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                        \u2502\n          \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n          \u25bc             \u25bc             \u25bc\n    \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n    \u2502  LM Studio\u2502 \u2502  Stripe  \u2502 \u2502 Obsidian \u2502\n    \u2502 (local AI)\u2502 \u2502 (payments\u2502 \u2502  (vault) \u2502\n    \u2502           \u2502 \u2502  + subs) \u2502 \u2502          \u2502\n    \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Decision matrix\n\nIf you\u2019re adapting this stack for a different use case, here\u2019s a quick decision guide:\n\n| Need | Choose | Alternative |\n|------|--------|-------------|\n| Simple local dev | SQLite | PostgreSQL |\n| Production database | PostgreSQL | MySQL |\n| AI inference | LM Studio local | OpenAI API |\n| Payments | Stripe | Paddle (if reseller model preferred) |\n| Knowledge base | Obsidian | Plain Markdown folder |\n| Deployment | Docker | bare metal with systemd |\n| Frontend | FastAPI docs | React, HTMX, or plain HTML |\n| Queue for long jobs | asyncio + state | Celery + Redis |\n\nThe workforce is built to be swapped. Change the database, keep the agents. Change the LLM, keep the workflow. Change the payment processor, keep the funnel logic.\n\n---\n\n## What comes next\n\nYou now understand the team and the tools. In Part 2, we start building. Chapter 4 scaffolds the workspace. You\u2019ll create the directory structure, initialise Git, set up Docker, and write the first configuration files. By the end of the chapter, you\u2019ll have a working development environment.\n\nThen Chapters 5, 6, and 7 build the database, the API server, and the agents. Each chapter is hands-on. You\u2019ll write code, run tests, and see the system come to life.\n\nThe machine starts here.\n\n---\n\n*End of Chapter 3*\n"}, {"number": 4, "title": "Chapter 4: Project Zero \u2014 Scaffold the Workspace", "content": "# Chapter 4: Project Zero \u2014 Scaffold the Workspace\n\n*Directory structure, environment setup, Git, Docker, and first-run verification.*\n\n---\n\n## The goal of this chapter\n\nBy the end of this chapter, you will have a working development environment. Not a theoretical architecture diagram. A real folder on your machine with code you can run, tests you can execute, and a Git repository you can push to GitHub.\n\nWe\u2019re calling this \u201cProject Zero\u201d because it\u2019s the foundation everything else sits on. Get this right, and the rest of the book is just adding features. Get it wrong, and you\u2019ll spend weeks debugging environment issues.\n\n---\n\n## Directory structure\n\nCreate the project folder and initialise the structure. Open your terminal and run:\n\n```bash\nmkdir -p ~/fair-dinkum-publishing-agent-workforce/{app/{agents,api,core,models,services},tests,docs,data,book/chapters}\ncd ~/fair-dinkum-publishing-agent-workforce\ntouch app/{agents,api,core,models,services}/__init__.py\ntouch README.md LICENSE .gitignore pyproject.toml\n```\n\nYour tree should look like this:\n\n```\nfair-dinkum-publishing-agent-workforce/\n\u251c\u2500\u2500 app/\n\u2502   \u251c\u2500\u2500 agents/\n\u2502   \u2502   \u2514\u2500\u2500 __init__.py\n\u2502   \u251c\u2500\u2500 api/\n\u2502   \u2502   \u2514\u2500\u2500 __init__.py\n\u2502   \u251c\u2500\u2500 core/\n\u2502   \u2502   \u2514\u2500\u2500 __init__.py\n\u2502   \u251c\u2500\u2500 models/\n\u2502   \u2502   \u2514\u2500\u2500 __init__.py\n\u2502   \u2514\u2500\u2500 services/\n\u2502       \u2514\u2500\u2500 __init__.py\n\u251c\u2500\u2500 tests/\n\u251c\u2500\u2500 docs/\n\u251c\u2500\u2500 data/\n\u251c\u2500\u2500 book/\n\u2502   \u2514\u2500\u2500 chapters/\n\u251c\u2500\u2500 README.md\n\u251c\u2500\u2500 LICENSE\n\u251c\u2500\u2500 .gitignore\n\u2514\u2500\u2500 pyproject.toml\n```\n\nWhy this layout? Separation of concerns. Agents contain the specialist logic. The API exposes endpoints. The core holds database and repository code. Models define the schema. Services orchestrate the workflow. Tests mirror the source tree so you always know where to find tests for a given module.\n\n---\n\n## The .gitignore\n\nBefore you write any code, configure Git to ignore the files that should never be committed.\n\n```bash\ncat > .gitignore << 'EOF'\n# Python\n__pycache__/\n*.pyc\n*.egg-info/\n.venv/\nvenv/\n\n# Data and secrets\n.env\n*.db\ndata/\n!data/.gitkeep\n\n# IDE\n.vscode/\n.idea/\n*.swp\n\n# OS\n.DS_Store\nThumbs.db\n\n# Docker\ndocker-compose.override.yml\n\n# Alembic\nalembic/versions/*.pyc\nEOF\n\ntouch data/.gitkeep\n```\n\nThe `.env` and `*.db` rules prevent secrets and local databases from leaking into Git. The `data/.gitkeep` trick ensures Git tracks the empty `data/` folder even though it ignores everything inside it.\n\n---\n\n## Git initialisation and first commit\n\n```bash\ngit init\ngit config user.name \"Your Name\"\ngit config user.email \"you@example.com\"\ngit add -A\ngit commit -m \"Project Zero: scaffold workspace\"\n```\n\nIf you\u2019ve already done this in a previous session, skip it. The commit history is your project\u2019s memory. Every meaningful change gets a commit with a clear message.\n\n---\n\n## pyproject.toml: project metadata and dependencies\n\n`pyproject.toml` is the modern Python project manifest. It defines metadata, build system, and dependencies in one file.\n\nCreate it:\n\n```bash\ncat > pyproject.toml << 'EOF'\n[build-system]\nrequires = [\"hatchling\"]\nbuild-backend = \"hatchling.build\"\n\n[project]\nname = \"fair-dinkum-publishing-agent-workforce\"\nversion = \"0.1.0\"\ndescription = \"MCP server orchestrating the end-to-end ebook production pipeline.\"\nrequires-python = \">=3.10\"\ndependencies = [\n    \"fastapi[all]>=0.100.0\",\n    \"uvicorn[standard]>=0.20.0\",\n    \"pydantic>=2.0.0\",\n    \"sqlalchemy>=2.0.0\",\n    \"alembic>=1.12.0\",\n    \"stripe>=7.0.0\",\n    \"python-dotenv>=1.0.0\",\n]\n\n[tool.hatch.build.targets.wheel]\npackages = [\"app\"]\nEOF\n```\n\nKey points:\n- `requires-python = \">=3.10\"` ensures you have modern language features like `match` statements and `list[str]` syntax.\n- `fastapi[all]` pulls in the server plus optional dependencies like `python-multipart` for form handling.\n- `sqlalchemy>=2.0.0` gives you the modern 2.0 API with `select()` constructs and improved typing.\n- `hatchling` is the build backend. It\u2019s lightweight and handles package discovery automatically.\n\n---\n\n## The PEP 668 reality check\n\nIf you\u2019re on a modern Linux distribution like Fedora, Debian 12+, or Ubuntu 23.10+, you\u2019ve hit PEP 668 \u2014 the \u201cexternally managed environment\u201d restriction. It prevents `pip install` from modifying system Python.\n\nYou have three options:\n\n**Option A: Virtual environment (preferred)**\n```bash\npython3 -m venv .venv\nsource .venv/bin/activate\npip install -e .\n```\n\n**Option B: User install with --break-system-packages**\n```bash\npip install --break-system-packages -e .\n```\n\n**Option C: uv (fastest)**\n```bash\npip install --break-system-packages uv\nuv pip install -e .\n```\n\nThis book assumes Option B or C for simplicity. If you prefer venvs, the commands are the same after activation. The code doesn\u2019t care where the packages live.\n\nFor the Fair Dinkum Publishing project specifically, we installed dependencies system-wide because it\u2019s a single-user workstation environment. If you\u2019re deploying to a server, use a venv or Docker.\n\n---\n\n## Docker: one-command startup\n\nCreate `Dockerfile`:\n\n```bash\ncat > Dockerfile << 'EOF'\nFROM python:3.13-slim\n\n# Install system dependencies\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    build-essential \\\n    && rm -rf /var/lib/apt/lists/*\n\nWORKDIR /app\n\n# Install Python dependencies\nCOPY pyproject.toml .\nRUN pip install --no-cache-dir -e .\n\n# Copy application code\nCOPY app/ ./app/\nCOPY tests/ ./tests/\nCOPY alembic.ini .\nCOPY alembic/ ./alembic/\n\n# Create data directory\nRUN mkdir -p data\n\nEXPOSE 8000\n\nCMD [\"uvicorn\", \"app.api.server:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\nEOF\n```\n\nCreate `docker-compose.yml`:\n\n```bash\ncat > docker-compose.yml << 'EOF'\nversion: \"3.9\"\n\nservices:\n  app:\n    build: .\n    ports:\n      - \"8000:8000\"\n    environment:\n      - DATABASE_URL=sqlite:///./data/app.db\n      - APP_ENV=development\n    volumes:\n      - ./data:/app/data\n    restart: unless-stopped\n\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_USER: fairdinkum\n      POSTGRES_PASSWORD: changeme\n      POSTGRES_DB: fairdinkum\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    ports:\n      - \"5432:5432\"\n    restart: unless-stopped\n\nvolumes:\n  postgres_data:\nEOF\n```\n\nThe `app` service builds from the Dockerfile and mounts the local `data/` directory so your database persists between restarts. The `db` service is optional \u2014 use it when you outgrow SQLite.\n\nTo start everything:\n```bash\ndocker compose up\n```\n\nTo stop:\n```bash\ndocker compose down\n```\n\n---\n\n## run_server.py: the local entry point\n\nNot everyone wants to use Docker. Create a simple entry point for `uvicorn`:\n\n```bash\ncat > run_server.py << 'EOF'\n#!/usr/bin/env python3\n\"\"\"Entry point for the Fair Dinkum Publishing Agent Workforce server.\"\"\"\nimport uvicorn\n\nif __name__ == \"__main__\":\n    uvicorn.run(\n        \"app.api.server:app\",\n        host=\"0.0.0.0\",\n        port=8000,\n        reload=True,\n    )\nEOF\n```\n\nRun it:\n```bash\npython3 run_server.py\n```\n\nOpen `http://localhost:8000/docs` in your browser. You should see the FastAPI automatic documentation. If you do, the scaffold is working.\n\n---\n\n## First tests: prove the scaffold works\n\nCreate `tests/test_scaffold.py`:\n\n```bash\ncat > tests/test_scaffold.py << 'EOF'\n\"\"\"Tests that verify the project scaffold is correctly structured.\"\"\"\nimport os\nimport sys\nimport pytest\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\n\ndef test_project_root_exists():\n    \"\"\"Verify we're running from the correct directory.\"\"\"\n    assert os.path.exists(\"app\")\n    assert os.path.exists(\"tests\")\n    assert os.path.exists(\"pyproject.toml\")\n\n\ndef test_app_packages_exist():\n    \"\"\"Verify all app packages are present.\"\"\"\n    packages = [\"agents\", \"api\", \"core\", \"models\", \"services\"]\n    for pkg in packages:\n        assert os.path.exists(f\"app/{pkg}\"), f\"Missing package: app/{pkg}\"\n        assert os.path.exists(f\"app/{pkg}/__init__.py\"), f\"Missing __init__.py in app/{pkg}\"\n\n\ndef test_tests_directory_has_files():\n    \"\"\"Verify tests directory is not empty.\"\"\"\n    test_files = os.listdir(\"tests\")\n    assert len(test_files) > 0, \"tests/ directory is empty\"\n    assert \"test_scaffold.py\" in test_files\n\n\ndef test_data_directory_exists():\n    \"\"\"Verify data directory exists for SQLite.\"\"\"\n    assert os.path.exists(\"data\"), \"data/ directory missing\"\n\n\ndef test_git_repository_initialised():\n    \"\"\"Verify Git repository exists.\"\"\"\n    assert os.path.exists(\".git\"), \"Git repository not initialised\"\n\n\ndef test_pyproject_toml_valid():\n    \"\"\"Verify pyproject.toml can be parsed.\"\"\"\n    import tomllib\n    with open(\"pyproject.toml\", \"rb\") as f:\n        config = tomllib.load(f)\n    assert \"project\" in config\n    assert config[\"project\"][\"name\"] == \"fair-dinkum-publishing-agent-workforce\"\nEOF\n```\n\nRun the tests:\n\n```bash\npython3 -m pytest tests/test_scaffold.py -v\n```\n\nYou should see all six tests pass. If they don\u2019t, fix the scaffold before proceeding. The rest of the book assumes a working environment.\n\n---\n\n## README.md: the landing page\n\nEvery project needs a README. Create it:\n\n```bash\ncat > README.md << 'EOF'\n# Fair Dinkum Publishing Agent Workforce\n\nLocal-first AI ebook production pipeline. 15 specialised agents, FastAPI MCP server, SQLAlchemy tracking, Stripe payments, Obsidian vault publishing.\n\n## Quick start\n\n```bash\npython3 -m pip install --break-system-packages -e .\npython3 -m pytest tests/ -v\npython3 run_server.py\n```\n\nOpen http://localhost:8000/docs to see the API.\n\n## What it does\n\nTurns a niche idea into a published ebook with sales assets and Stripe checkout. No SaaS subscriptions. Your data stays on your machine.\n\n## Stack\n\n- FastAPI + Uvicorn\n- SQLAlchemy + Alembic\n- Stripe Python SDK\n- Obsidian Markdown publishing\n- Local LLMs via LM Studio or Ollama\n\n## License\n\nMIT\nEOF\n```\n\n---\n\n## License: MIT\n\n```bash\ncat > LICENSE << 'EOF'\nMIT License\n\nCopyright (c) 2026 Fair Dinkum Publishing\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\nEOF\n```\n\nMIT is the right choice for this project. It lets anyone use, modify, and distribute the code without legal friction. If you want to contribute back to the community, MIT removes barriers.\n\n---\n\n## .env.example: the configuration template\n\nCreate `.env.example`:\n\n```bash\ncat > .env.example << 'EOF'\nAPP_ENV=development\nDATABASE_URL=sqlite:///./data/app.db\nOBSIDIAN_VAULT_PATH=./data/obsidian-vault\nARTIFACT_STORAGE_PATH=./data/artifacts\nUPLOAD_STORAGE_PATH=./data/uploads\nPUBLIC_BASE_URL=http://localhost:8000\nSTRIPE_SECRET_KEY=\nSTRIPE_WEBHOOK_SECRET=\nSTRIPE_PAYMENT_LINK_DEFAULT=\nEMAIL_PROVIDER=mock\nRESEND_API_KEY=\nSMTP_HOST=\nSMTP_PORT=\nSMTP_USERNAME=\nSMTP_PASSWORD=\nSUPPORT_EMAIL=\nLLM_PROVIDER=mock\nLLM_BASE_URL=\nLLM_API_KEY=\nLLM_MODEL=\nIMAGE_PROVIDER=placeholder\nIMAGE_API_KEY=\nIMAGE_BASE_URL=\nS3_ENDPOINT_URL=\nS3_BUCKET=\nS3_ACCESS_KEY_ID=\nS3_SECRET_ACCESS_KEY=\nENABLE_LIVE_ACTIONS=false\nREQUIRE_HUMAN_APPROVAL=true\nEOF\n```\n\nThis file shows every environment variable the system recognises. None of the values are secrets. You copy this to `.env` and fill in your actual keys.\n\n---\n\n## Verify the scaffold\n\nRun the full verification:\n\n```bash\npython3 -m pytest tests/test_scaffold.py -v\n```\n\nExpected output:\n```\ntests/test_scaffold.py::test_project_root_exists PASSED\ntests/test_scaffold.py::test_app_packages_exist PASSED\ntests/test_scaffold.py::test_tests_directory_has_files PASSED\ntests/test_scaffold.py::test_data_directory_exists PASSED\ntests/test_scaffold.py::test_git_repository_initialised PASSED\ntests/test_scaffold.py::test_pyproject_toml_valid PASSED\n```\n\nIf all six pass, your scaffold is solid.\n\n---\n\n## Commit the scaffold\n\n```bash\ngit add -A\ngit commit -m \"Project Zero: scaffold workspace, config, and tests\"\n```\n\nThis commit is your safety net. If anything breaks later, you can always return to this clean state.\n\n---\n\n## What you\u2019ve built so far\n\n- Directory structure with five app packages\n- Git repository with initial commit\n- pyproject.toml with all dependencies\n- Dockerfile and docker-compose.yml\n- run_server.py entry point\n- .env.example configuration template\n- MIT license\n- Scaffold tests that verify the structure\n\nWhat you haven\u2019t built yet:\n- The database models\n- The FastAPI routes\n- The fifteen agents\n- The workflow service\n- The Stripe integration\n- The Obsidian publishing logic\n\nAll of that comes in the next four chapters.\n\n---\n\n## Troubleshooting\n\n**\u201cpip install fails with externally managed environment\u201d**\nUse `pip install --break-system-packages -e .` or create a virtual environment with `python3 -m venv .venv && source .venv/bin/activate`.\n\n**\u201cDocker build fails because of network timeout\u201d**\nDocker needs to download the Python base image. If you\u2019re on a slow connection, increase the timeout or use a local mirror.\n\n**\u201cTests can\u2019t find the app module\u201d**\nMake sure you\u2019re running tests from the project root and that `sys.path.insert(0, ...)` is in every test file.\n\n**\u201cGit commit fails because user.email is not set\u201d**\nRun `git config user.email \"you@example.com\"` and `git config user.name \"Your Name\"`.\n\n---\n\n## What comes next\n\nChapter 5 builds the database. You\u2019ll create the SQLAlchemy models, run Alembic migrations, and write the repository layer that the agents use to read and write data. By the end of Chapter 5, you\u2019ll have a persistent project tracker.\n\nChapter 6 builds the FastAPI MCP server. You\u2019ll create the agent routes, project CRUD endpoints, and Stripe integration points. By the end of Chapter 6, you\u2019ll have a working API you can test from your browser.\n\nChapter 7 builds the fifteen agents. You\u2019ll implement each one, wire them to the workflow service, and write tests that verify the end-to-end pipeline.\n\nThe machine is taking shape.\n\n---\n\n*End of Chapter 4*\n"}, {"number": 5, "title": "Chapter 5: The Database Backbone", "content": "# Chapter 5: The Database Backbone\n\n*SQLAlchemy models, Alembic migrations, the repository pattern, and local-first data strategy.*\n\n---\n\n## Why you need a database\n\nAgents generate data. Lots of it. The Market Researcher produces keyword lists and competitor summaries. The Opportunity Scorer produces ranked niches with scores. The Outline Architect produces hierarchical structures. The Manuscript Author produces chapters and sections. The Production Lead produces final files. The Funnel Builder produces Stripe checkout URLs.\n\nIf you store this data in plain text files, you lose the ability to query, relate, and version it. You can\u2019t ask \u201cshow me all projects where the opportunity score was above 80\u201d or \u201cwhich chapters belong to project X?\u201d without writing custom parsers.\n\nA database solves this. It gives you:\n- **Structured storage:** Every project, outline, manuscript, and artifact has a defined schema.\n- **Query power:** You can filter, sort, and join data across projects.\n- **Version control:** Alembic tracks schema changes so you can migrate between versions.\n- **Concurrency:** Multiple agents can read and write safely without corrupting data.\n\nThe Fair Dinkum Publishing workforce uses SQLAlchemy as the ORM and Alembic for migrations. The default backend is SQLite \u2014 a single file database that needs no server. When you outgrow SQLite, you switch to PostgreSQL by changing one environment variable.\n\n---\n\n## The entity model\n\nBefore writing code, let\u2019s map the entities and their relationships.\n\n**Project**\nThe central entity. Every ebook starts as a project. A project has a title, niche, status, positioning data, outline, manuscript paths, cover paths, ebook paths, sales copy paths, Stripe payment links, and Obsidian note paths.\n\n**OpportunityScore**\nAttached to a project. Stores the ranked niche list, demand scores, competition scores, monetisation fit scores, and production effort estimates.\n\n**Outline / Chapter**\nAn outline belongs to a project. An outline contains multiple chapters. Each chapter has a title, summary, estimated word count, and ordering.\n\n**Manuscript / Section**\nA manuscript belongs to a project. A manuscript contains multiple sections. Each section maps to a chapter or subsection and contains the actual prose in Markdown.\n\n**Artifact**\nA generic container for any generated file: covers, sales copy, ebook files, research notes. Each artifact has a type, file path, MIME type, and metadata.\n\nThe relationships look like this:\n\n```\nProject 1 \u2500\u2500< OpportunityScore\nProject 1 \u2500\u2500< Outline >\u2500\u2500 Chapter\nProject 1 \u2500\u2500< Manuscript >\u2500\u2500 Section\nProject 1 \u2500\u2500< Artifact\n```\n\nOne project has one opportunity score, one outline, one manuscript, and many artifacts.\n\n---\n\n## SQLAlchemy setup\n\nCreate `app/core/database.py`:\n\n```python\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.ext.declarative import declarative_base\nfrom sqlalchemy.orm import sessionmaker, Session\nimport os\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\nDATABASE_URL = os.getenv(\"DATABASE_URL\", \"sqlite:///./data/app.db\")\n\n# SQLite needs check_same_thread=False for FastAPI's threading model\nconnect_args = {\"check_same_thread\": False} if \"sqlite\" in DATABASE_URL else {}\n\nengine = create_engine(DATABASE_URL, connect_args=connect_args)\nSessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)\nBase = declarative_base()\n\n\ndef get_db() -> Session:\n    \"\"\"FastAPI dependency that provides a database session.\"\"\"\n    db = SessionLocal()\n    try:\n        yield db\n    finally:\n        db.close()\n```\n\nThis file does three things:\n1. Reads `DATABASE_URL` from the environment, defaulting to SQLite.\n2. Creates the SQLAlchemy engine and session factory.\n3. Provides a `get_db()` generator for FastAPI dependency injection.\n\nThe `check_same_thread=False` flag is specific to SQLite. It allows FastAPI to share the connection across threads. PostgreSQL doesn\u2019t need it.\n\n---\n\n## The models\n\nCreate `app/models/project.py`:\n\n```python\nfrom sqlalchemy import Column, String, Text, Enum, DateTime\nfrom sqlalchemy.sql import func\nimport enum\nfrom app.core.database import Base\nimport uuid\n\n\nclass ProjectStatus(str, enum.Enum):\n    briefed = \"briefed\"\n    research_complete = \"research_complete\"\n    positioning_ready = \"positioning_ready\"\n    outline_ready = \"outline_ready\"\n    manuscript_draft = \"manuscript_draft\"\n    polished = \"polished\"\n    production_ready = \"production_ready\"\n    launched = \"launched\"\n    archived = \"archived\"\n\n\nclass Project(Base):\n    __tablename__ = \"projects\"\n\n    id = Column(String, primary_key=True, default=lambda: str(uuid.uuid4()))\n    title = Column(String, nullable=False)\n    niche = Column(String, nullable=False)\n    status = Column(Enum(ProjectStatus), default=ProjectStatus.briefed, nullable=False)\n    product_brief = Column(Text, nullable=True)\n    positioning_statement = Column(Text, nullable=True)\n    outline = Column(Text, nullable=True)  # JSON string\n    manuscript_path = Column(String, nullable=True)\n    cover_path = Column(String, nullable=True)\n    ebook_path = Column(String, nullable=True)\n    sales_copy_path = Column(String, nullable=True)\n    funnel_url = Column(String, nullable=True)\n    stripe_payment_link = Column(String, nullable=True)\n    obsidian_note_path = Column(String, nullable=True)\n    created_at = Column(DateTime(timezone=True), server_default=func.now())\n    updated_at = Column(DateTime(timezone=True), server_default=func.now(), onupdate=func.now())\n    version = Column(String, default=\"0.1.0\")\n```\n\nCreate `app/models/opportunity.py`:\n\n```python\nfrom sqlalchemy import Column, String, Text, Integer, ForeignKey\nfrom sqlalchemy.orm import relationship\nfrom app.core.database import Base\nimport uuid\n\n\nclass OpportunityScore(Base):\n    __tablename__ = \"opportunity_scores\"\n\n    id = Column(String, primary_key=True, default=lambda: str(uuid.uuid4()))\n    project_id = Column(String, ForeignKey(\"projects.id\"), nullable=False)\n    keywords = Column(Text, nullable=True)  # JSON string\n    competitor_summary = Column(Text, nullable=True)\n    demand_score = Column(Integer, nullable=True)\n    competition_score = Column(Integer, nullable=True)\n    monetisation_score = Column(Integer, nullable=True)\n    effort_score = Column(Integer, nullable=True)\n    overall_score = Column(Integer, nullable=True)\n    ranked_niches = Column(Text, nullable=True)  # JSON string\n    created_at = Column(Text, nullable=True)  # ISO string for simplicity\n```\n\nCreate `app/models/outline.py`:\n\n```python\nfrom sqlalchemy import Column, String, Text, Integer, ForeignKey\nfrom sqlalchemy.orm import relationship\nfrom app.core.database import Base\nimport uuid\n\n\nclass Outline(Base):\n    __tablename__ = \"outlines\"\n\n    id = Column(String, primary_key=True, default=lambda: str(uuid.uuid4()))\n    project_id = Column(String, ForeignKey(\"projects.id\"), nullable=False)\n    title = Column(String, nullable=False)\n    summary = Column(Text, nullable=True)\n    estimated_word_count = Column(Integer, nullable=True)\n    chapters = relationship(\"Chapter\", back_populates=\"outline\", cascade=\"all, delete-orphan\")\n\n\nclass Chapter(Base):\n    __tablename__ = \"chapters\"\n\n    id = Column(String, primary_key=True, default=lambda: str(uuid.uuid4()))\n    outline_id = Column(String, ForeignKey(\"outlines.id\"), nullable=False)\n    title = Column(String, nullable=False)\n    summary = Column(Text, nullable=True)\n    order = Column(Integer, nullable=False)\n    estimated_word_count = Column(Integer, nullable=True)\n    outline = relationship(\"Outline\", back_populates=\"chapters\")\n```\n\nCreate `app/models/manuscript.py`:\n\n```python\nfrom sqlalchemy import Column, String, Text, Integer, ForeignKey\nfrom sqlalchemy.orm import relationship\nfrom app.core.database import Base\nimport uuid\n\n\nclass Manuscript(Base):\n    __tablename__ = \"manuscripts\"\n\n    id = Column(String, primary_key=True, default=lambda: str(uuid.uuid4()))\n    project_id = Column(String, ForeignKey(\"projects.id\"), nullable=False)\n    title = Column(String, nullable=False)\n    word_count = Column(Integer, default=0)\n    sections = relationship(\"Section\", back_populates=\"manuscript\", cascade=\"all, delete-orphan\")\n\n\nclass Section(Base):\n    __tablename__ = \"sections\"\n\n    id = Column(String, primary_key=True, default=lambda: str(uuid.uuid4()))\n    manuscript_id = Column(String, ForeignKey(\"manuscripts.id\"), nullable=False)\n    chapter_id = Column(String, nullable=True)  # Links to Chapter.id\n    title = Column(String, nullable=False)\n    content = Column(Text, nullable=True)\n    order = Column(Integer, nullable=False)\n    word_count = Column(Integer, default=0)\n    manuscript = relationship(\"Manuscript\", back_populates=\"sections\")\n```\n\nCreate `app/models/artifact.py`:\n\n```python\nfrom sqlalchemy import Column, String, Text, DateTime\nfrom sqlalchemy.sql import func\nfrom app.core.database import Base\nimport uuid\n\n\nclass Artifact(Base):\n    __tablename__ = \"artifacts\"\n\n    id = Column(String, primary_key=True, default=lambda: str(uuid.uuid4()))\n    project_id = Column(String, nullable=False, index=True)\n    artifact_type = Column(String, nullable=False)  # cover, manuscript, ebook, sales_copy, etc.\n    file_path = Column(String, nullable=True)\n    mime_type = Column(String, nullable=True)\n    metadata_json = Column(Text, nullable=True)  # JSON string for extra data\n    created_at = Column(DateTime(timezone=True), server_default=func.now())\n```\n\nCreate `app/models/__init__.py`:\n\n```python\nfrom app.models.project import Project, ProjectStatus\nfrom app.models.opportunity import OpportunityScore\nfrom app.models.outline import Outline, Chapter\nfrom app.models.manuscript import Manuscript, Section\nfrom app.models.artifact import Artifact\n```\n\n---\n\n## The repository layer\n\nDirect ORM usage in agents creates tight coupling. The repository pattern abstracts database access. Agents call repository methods like `ProjectRepository.create()` and never touch SQLAlchemy sessions directly.\n\nCreate `app/core/repositories.py`:\n\n```python\nfrom sqlalchemy.orm import Session\nfrom app.models.project import Project, ProjectStatus\nfrom app.models.opportunity import OpportunityScore\nfrom app.models.outline import Outline, Chapter\nfrom app.models.manuscript import Manuscript, Section\nfrom app.models.artifact import Artifact\nimport json\n\n\nclass ProjectRepository:\n    @staticmethod\n    def create(db: Session, project_id: str, title: str, niche: str, product_brief: str = None) -> Project:\n        project = Project(\n            id=project_id,\n            title=title,\n            niche=niche,\n            product_brief=product_brief,\n        )\n        db.add(project)\n        db.commit()\n        db.refresh(project)\n        return project\n\n    @staticmethod\n    def get(db: Session, project_id: str) -> Project:\n        return db.query(Project).filter(Project.id == project_id).first()\n\n    @staticmethod\n    def update_status(db: Session, project_id: str, status: ProjectStatus) -> Project:\n        project = ProjectRepository.get(db, project_id)\n        if project:\n            project.status = status\n            db.commit()\n            db.refresh(project)\n        return project\n\n    @staticmethod\n    def update(db: Session, project_id: str, **kwargs) -> Project:\n        project = ProjectRepository.get(db, project_id)\n        if project:\n            for key, value in kwargs.items():\n                if hasattr(project, key):\n                    setattr(project, key, value)\n            db.commit()\n            db.refresh(project)\n        return project\n\n    @staticmethod\n    def list(db: Session, limit: int = 10) -> list[Project]:\n        return db.query(Project).limit(limit).all()\n\n\nclass OpportunityRepository:\n    @staticmethod\n    def create(db: Session, project_id: str, **kwargs) -> OpportunityScore:\n        score = OpportunityScore(project_id=project_id, **kwargs)\n        db.add(score)\n        db.commit()\n        db.refresh(score)\n        return score\n\n    @staticmethod\n    def get_by_project(db: Session, project_id: str) -> OpportunityScore:\n        return db.query(OpportunityScore).filter(OpportunityScore.project_id == project_id).first()\n\n\nclass OutlineRepository:\n    @staticmethod\n    def create(db: Session, project_id: str, title: str, summary: str = None, estimated_word_count: int = None) -> Outline:\n        outline = Outline(\n            project_id=project_id,\n            title=title,\n            summary=summary,\n            estimated_word_count=estimated_word_count,\n        )\n        db.add(outline)\n        db.commit()\n        db.refresh(outline)\n        return outline\n\n
