)\n\n- [ ] Day 1: Launch announcement to email list\n- [ ] Day 2: Social media launch posts\n- [ ] Day 3: First reader testimonial shared\n- [ ] Day 4: Podcast guest appearance or guest post\n- [ ] Day 5: Limited-time launch bonus announced\n- [ [Day 6: Email sequence continues\n- [ ] Day 7: Launch week wrap-up, bonus expiry warning\n\n### Post-launch (Days 8-30)\n\n- [ ] Expand to Gumroad and Amazon\n- [ ] Collect and publish reviews\n- [ ] Run first A/B test on landing page\n- [ ] Analyse Week 1 data and adjust email sequence\n- [ ] Plan next book based on reader feedback\n\n## Key takeaways\n\n- Track gross revenue, net revenue, and revenue per customer.\n- Measure churn by type: gross, net, and cohort retention.\n- Design A/B tests with clear hypotheses and statistical significance.\n- Launch on your own site first, then expand to marketplaces.\n- Timing matters: weekday, seasonal, and event alignment.\n- A 30-day launch playbook coordinates all moving parts.\n\nYour launch plan is set. Next: production deployment and operations.\n"}, {"number": 13, "title": "Chapter 13: Production Deployment", "content": "# Chapter 13: Production Deployment\n\n*Docker containerisation, environment configuration, CI/CD, logging, monitoring, and alerting.*\n\n---\n\n## The deployment gap\n\nBuilding software is one thing. Running it reliably in production is another. This chapter bridges that gap \u2014 taking the Fair Dinkum Publishing workforce from a local development setup to a production deployment that runs 24/7 without constant attention.\n\n## Docker containerisation\n\nThe entire workforce runs in Docker containers. The `docker-compose.yml` defines the full stack:\n\n```yaml\nversion: \"3.9\"\n\nservices:\n  api:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    ports:\n      - \"8000:8000\"\n    environment:\n      - DATABASE_URL=sqlite:///data/workforce.db\n      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}\n      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}\n      - JWT_SECRET=${JWT_SECRET}\n      - LOG_LEVEL=INFO\n    volumes:\n      - ./data:/app/data\n      - ./logs:/app/logs\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n\n  stripe-mcp:\n    build:\n      context: ./stripe-mcp-server\n      dockerfile: Dockerfile\n    ports:\n      - \"8001:8001\"\n    environment:\n      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}\n      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}\n    restart: unless-stopped\n\n  webhook-proxy:\n    image: stripe/stripe-cli:latest\n    command: listen --forward-to http://api:8000/webhooks/stripe\n    environment:\n      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}\n      - STRIPE_DEVICE_NAME=fair-dinkum-prod\n    restart: unless-stopped\n```\n\n### Multi-stage Dockerfile\n\nThe API Dockerfile uses multi-stage builds to keep the image small:\n\n```dockerfile\n# Stage 1: Build dependencies\nFROM python:3.13-slim as builder\nWORKDIR /app\nCOPY pyproject.toml .\nRUN pip install --no-cache-dir --break-system-packages -e .\n\n# Stage 2: Production image\nFROM python:3.13-slim\nWORKDIR /app\nCOPY --from=builder /usr/local/lib/python3.13/site-packages /usr/local/lib/python3.13/site-packages\nCOPY . .\nEXPOSE 8000\nCMD [\"uvicorn\", \"app.api.server:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\n## Environment configuration\n\nProduction configuration comes from environment variables, never from code:\n\n```bash\n# .env.production\nDATABASE_URL=sqlite:///data/workforce.db\nSTRIPE_SECRET_KEY=sk_live_***\nSTRIPE_WEBHOOK_SECRET=whsec_***\nJWT_SECRET=your-256-bit-secret-here\nLOG_LEVEL=INFO\nLOG_FORMAT=json\nSENTRY_DSN=https://sentry.io/your-dsn\nALLOWED_ORIGINS=https://fairdinkum.com,https://www.fairdinkum.com\n```\n\n### Secrets management\n\nSecrets are never committed to git. They're injected at deployment time:\n\n```bash\n# Load secrets from a secure location\nexport $(cat .env.production | xargs)\n\n# Or use Docker secrets\necho \"sk_live_***\" | docker secret create stripe_secret_key -\n```\n\n## Database migrations\n\nSchema changes are managed with Alembic:\n\n```bash\n# Generate a new migration\nalembic revision --autogenerate -m \"add customer table\"\n\n# Review the migration\ncat migrations/versions/xxxx_add_customer_table.py\n\n# Apply migrations\nalembic upgrade head\n\n# Rollback one step\nalembic downgrade -1\n```\n\n### Production migration checklist\n\n1. Backup the database before migrating\n2. Run migrations in a staging environment first\n3. Verify migrations apply cleanly\n4. Apply to production during low-traffic hours\n5. Verify application health after migration\n6. Keep the rollback script ready\n\n## CI/CD pipeline\n\nGitHub Actions automates testing and deployment:\n\n```yaml\nname: Deploy\n\non:\n  push:\n    branches: [main]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.13\"\n      - run: pip install --break-system-packages -e \".[dev]\"\n      - run: pytest tests/ -v --tb=short\n\n  deploy:\n    needs: test\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Deploy to production\n        run: |\n          ssh deploy@fairdinkum.com \"\n            cd /opt/fair-dinkum &&\n            git pull origin main &&\n            docker-compose -f docker-compose.prod.yml up -d --build\n          \"\n```\n\n## Logging\n\nStructured logging is essential for production debugging:\n\n```python\nimport structlog\n\nlogger = structlog.get_logger()\n\nasync def execute_agent(agent, context):\n    logger.info(\n        \"agent_execution_started\",\n        agent=agent.name,\n        project_id=context.project_id,\n        phase=context.phase\n    )\n    try:\n        result = await agent.execute(context)\n        logger.info(\n            \"agent_execution_completed\",\n            agent=agent.name,\n            project_id=context.project_id,\n            duration=result.duration,\n            artifacts_generated=len(result.artifacts)\n        )\n        return result\n    except Exception as e:\n        logger.error(\n            \"agent_execution_failed\",\n            agent=agent.name,\n            project_id=context.project_id,\n            error=str(e),\n            exc_info=True\n        )\n        raise\n```\n\n### Log levels\n\n- **DEBUG:** Detailed execution flow (development only)\n- **INFO:** Agent starts, completions, state transitions\n- **WARN:** Retries, slow executions, degraded performance\n- **ERROR:** Failures, exceptions, data integrity issues\n- **CRITICAL:** Security incidents, data loss, system unavailability\n\n## Monitoring\n\nProduction monitoring tracks four golden signals:\n\n### 1. Latency\n\nHow long requests take:\n\n```\nGET /health:     p50=12ms, p95=45ms, p99=89ms\nPOST /pipeline:  p50=2.3s, p95=8.1s, p99=15.4s\n```\n\n### 2. Traffic\n\nRequest volume over time:\n\n```\nRequests/minute: 45\nActive projects:  12\nQueue depth:      3\n```\n\n### 3. Errors\n\nFailure rate by endpoint:\n\n```\nOverall error rate: 0.3%\n/webhooks/stripe:   0.1%\n/pipeline/start:    1.2% \u2190 investigate\n```\n\n### 4. Saturation\n\nResource utilisation:\n\n```\nCPU:    34%\nMemory: 2.1GB / 4GB (53%)\nDisk:   12GB / 50GB (24%)\n```\n\n## Alerting\n\nAlerts are configured for conditions that require human attention:\n\n```yaml\nalerts:\n  - name: HighErrorRate\n    condition: error_rate > 5% for 5 minutes\n    severity: critical\n    notify: [email, sms]\n\n  - name: SlowAgentExecution\n    condition: agent_duration > 300s for 3 consecutive runs\n    severity: warning\n    notify: [email]\n\n  - name: DiskSpaceLow\n    condition: disk_usage > 80%\n    severity: warning\n    notify: [email]\n\n  - name: PaymentFailure\n    condition: stripe_webhook_errors > 10 in 10 minutes\n    severity: critical\n    notify: [email, sms]\n```\n\n## Backup strategy\n\nData loss is catastrophic. The backup strategy covers three layers:\n\n### 1. Database backups\n\n```bash\n# Daily automated backup\n0 2 * * * sqlite3 /app/data/workforce.db \".backup /backups/workforce-$(date +\\%Y\\%m\\%d).db\"\n\n# Weekly offsite sync\n0 3 * * 0 aws s3 sync /backups/ s3://fairdinkum-backups/\n```\n\n### 2. Artifact storage\n\nAll generated artifacts (manuscripts, covers, EPUBs) are stored in cloud object storage with versioning enabled.\n\n### 3. Configuration backup\n\nEnvironment files, Docker compose, and deployment scripts are stored in a private GitHub repository with access logging.\n\n## Key takeaways\n\n- Docker containers ensure consistent runtime environments.\n- Multi-stage builds keep images small and secure.\n- Environment variables inject secrets at deployment time.\n- Alembic manages schema migrations with rollback capability.\n- CI/CD automates testing and deployment.\n- Structured logging enables production debugging.\n- Monitor four golden signals: latency, traffic, errors, saturation.\n- Alert on conditions that require human attention.\n- Backup everything: database, artifacts, and configuration.\n\nYour production deployment is ready. Next: security and compliance.\n"}, {"number": 14, "title": "Chapter 14: Security & Compliance", "content": "# Chapter 14: Security & Compliance\n\n*Secrets management, webhook verification, injection prevention, CORS, rate limiting, and Australian regulatory compliance.*\n\n---\n\n## The security mindset\n\nSecurity isn't a feature you add at the end \u2014 it's a discipline you practice from day one. The Fair Dinkum workforce handles customer payments, personal data, and proprietary content. A breach in any of these would be catastrophic.\n\nThis chapter covers the security measures built into the workforce, not as an afterthought, but as foundational architecture.\n\n## Secrets management\n\n### The golden rule\n\nSecrets never appear in source code, configuration files, or logs. Ever. Not even in comments. Not even in example files with placeholder text like \"sk_live_***\".\n\n### How secrets flow\n\n```\nSecret vault (Docker secrets / CI secrets / local .env)\n    \u2193\nEnvironment variable at runtime\n    \u2193\nApplication reads from os.environ\n    \u2193\nNever logged, never serialised, never persisted\n```\n\n### Secret rotation\n\n```bash\n# Rotate Stripe secret key\nstripe secret rotate --name production\n\n# Update Docker secret\necho \"new_secret\" | docker secret create stripe_secret_key_new -\ndocker service update --secret-rm stripe_secret_key_old --secret-add src=stripe_secret_key_new,target=stripe_secret_key api\n```\n\nRotate keys on any suspected compromise and annually as a matter of policy.\n\n## Stripe webhook verification\n\nWebhooks are a common attack vector \u2014 anyone can POST to your endpoint pretending to be Stripe. Verification is non-negotiable:\n\n```python\nimport stripe\nfrom fastapi import Request, HTTPException\n\nasync def handle_stripe_webhook(request: Request):\n    payload = await request.body()\n    sig_header = request.headers.get(\"stripe-signature\")\n    \n    try:\n        event = stripe.Webhook.construct_event(\n            payload, sig_header, webhook_secret\n        )\n    except ValueError:\n        raise HTTPException(status_code=400, detail=\"Invalid payload\")\n    except stripe.error.SignatureVerificationError:\n        raise HTTPException(status_code=400, detail=\"Invalid signature\")\n    \n    # Process the verified event\n    await process_event(event)\n```\n\n### Why this matters\n\nWithout verification, an attacker could:\n\n- Mark unpaid invoices as paid\n- Trigger fake subscription cancellations\n- Generate fraudulent download links\n- Access customer email addresses\n\nThe signature verification ensures the webhook actually came from Stripe and wasn't modified in transit.\n\n## SQL injection prevention\n\nSQL injection remains one of the most common web application vulnerabilities. SQLAlchemy's ORM and parameterised queries provide strong defence:\n\n### Safe (ORM)\n\n```python\n# SQLAlchemy automatically parameterises\nproject = session.query(Project).filter(Project.id == project_id).first()\n```\n\n### Safe (Core with parameters)\n\n```python\nfrom sqlalchemy import text\n\nresult = session.execute(\n    text(\"SELECT * FROM projects WHERE id = :id\"),\n    {\"id\": project_id}\n)\n```\n\n### Unsafe (never do this)\n\n```python\n# String concatenation in SQL \u2014 NEVER\nresult = session.execute(f\"SELECT * FROM projects WHERE id = '{project_id}'\")\n```\n\nIf an attacker controls `project_id`, they could inject SQL like `' OR 1=1; DROP TABLE projects; --`. SQLAlchemy's parameterisation makes this impossible.\n\n## Cross-site scripting (XSS)\n\nThe API doesn't render HTML directly, but any user-generated content served to browsers needs sanitisation:\n\n```python\nimport bleach\n\ndef sanitize_html(content: str) -> str:\n    return bleach.clean(\n        content,\n        tags=[\"p\", \"br\", \"strong\", \"em\", \"ul\", \"ol\", \"li\", \"a\", \"h1\", \"h2\", \"h3\"],\n        attributes={\"a\": [\"href\", \"title\"]},\n        strip=True\n    )\n```\n\n## Cross-origin resource sharing (CORS)\n\nThe API only accepts requests from approved origins:\n\n```python\nfrom fastapi.middleware.cors import CORSMiddleware\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\n        \"https://fairdinkum.com\",\n        \"https://www.fairdinkum.com\",\n    ],\n    allow_credentials=True,\n    allow_methods=[\"GET\", \"POST\", \"PUT\", \"DELETE\"],\n    allow_headers=[\"Authorization\", \"Content-Type\"],\n)\n```\n\nRequests from other origins are rejected by the browser. This prevents malicious websites from making authenticated requests on behalf of logged-in users.\n\n## Rate limiting\n\nRate limiting prevents abuse of expensive endpoints:\n\n```python\nfrom fastapi import Request, HTTPException\nfrom datetime import datetime, timedelta\n\nclass RateLimiter:\n    def __init__(self, requests_per_minute: int = 30):\n        self.requests_per_minute = requests_per_minute\n        self.requests: dict[str, list[datetime]] = {}\n    \n    async def check(self, request: Request):\n        client_ip = request.client.host\n        now = datetime.utcnow()\n        window_start = now - timedelta(minutes=1)\n        \n        # Clean old entries\n        if client_ip in self.requests:\n            self.requests[client_ip] = [\n                t for t in self.requests[client_ip] if t > window_start\n            ]\n        else:\n            self.requests[client_ip] = []\n        \n        # Check limit\n        if len(self.requests[client_ip]) >= self.requests_per_minute:\n            raise HTTPException(status_code=429, detail=\"Rate limit exceeded\")\n        \n        self.requests[client_ip].append(now)\n```\n\nEndpoints with different resource costs use different limits:\n\n| Endpoint | Limit | Rationale |\n|----------|-------|-----------|\n| /health | 100/min | Cheap, health checks |\n| /pipeline/start | 10/min | Expensive, agent execution |\n| /webhooks/stripe | 200/min | External service |\n| /download | 30/min | Token validation |\n\n## Authentication and authorisation\n\n### API key authentication\n\n```python\nAPI_KEYS = {\"sk_live_***\": \"production\", \"sk_test_***\": \"testing\"}\n\nasync def verify_api_key(request: Request):\n    api_key = request.headers.get(\"Authorization\", \"\").replace(\"Bearer \", \"\")\n    if api_key not in API_KEYS:\n        raise HTTPException(status_code=401, detail=\"Invalid API key\")\n    return API_KEYS[api_key]\n```\n\n### Role-based access control\n\n```python\nROLES = {\n    \"admin\": [\"read\", \"write\", \"delete\", \"deploy\"],\n    \"author\": [\"read\", \"write\"],\n    \"viewer\": [\"read\"],\n}\n\ndef check_permission(role: str, permission: str):\n    if permission not in ROLES.get(role, []):\n        raise HTTPException(status_code=403, detail=\"Insufficient permissions\")\n```\n\n## Australian regulatory compliance\n\n### Australian Consumer Law (ACL)\n\nThe ebook must not make misleading claims. Specific rules:\n\n- **No unsubstantiated results:** \"Bestselling\" only if it actually was. \"Proven\" only with evidence.\n- **No fake testimonials:** All reviews must be from real buyers, unscripted.\n- **Clear pricing:** Total price displayed before purchase, no hidden charges.\n- **Refund policy:** Must comply with Australian consumer guarantees \u2014 if the product isn't as described, a refund is required by law.\n\n### Privacy Act 1988\n\nIf you collect personal information (email names, purchase records):\n\n- **Australian Privacy Principles:** Must have a privacy policy explaining what you collect and why.\n- **Data minimisation:** Only collect what you need. Don't ask for phone numbers if email suffices.\n- **Access and correction:** Customers can request their data be corrected or deleted.\n- **Data breach notification:** If a breach is likely to cause serious harm, notify the OAIC and affected individuals.\n\n### Spam Act 2003\n\nCommercial email must:\n\n- Have the recipient's consent (express or inferred)\n- Include a functional unsubscribe mechanism\n- Identify the sender accurately\n\nThe email sequence in Chapter 11 is designed to comply with these requirements.\n\n## Content compliance\n\n### Copyright\n\n- All images used with appropriate licence or original creation\n- Quotes attributed and within fair use limits\n- No scraped content from competitor books\n\n### Defamation\n\n- No identifiable individuals portrayed negatively without evidence\n- Opinions clearly labelled as opinions\n- No false statements that could damage reputation\n\n### Financial and health advice\n\n- General information only, not personalised advice\n- Disclaimers on every page with actionable advice\n- No specific recommendations to buy/sell investments or follow medical treatments\n\n## Security incident response\n\nDespite best practices, incidents happen. The response plan:\n\n1. **Identify:** Detect the incident through monitoring or reports\n2. **Contain:** Isolate affected systems and revoke compromised credentials\n3. **Eradicate:** Remove the root cause (patch vulnerability, fix configuration)\n4. **Recover:** Restore affected systems and data from clean backups\n5. **Learn:** Post-incident review to prevent recurrence\n\n### Communication templates\n\nPre-drafted templates for common scenarios:\n\n- Data breach notification to OAIC\n- Customer notification of security incident\n- Internal team communication\n- Public statement if needed\n\n## Key takeaways\n\n- Secrets never appear in code, config, or logs.\n- Stripe webhook verification is mandatory, not optional.\n- SQLAlchemy prevents SQL injection by default.\n- CORS restricts browser access to approved origins.\n- Rate limiting prevents abuse of expensive endpoints.\n- Australian Consumer Law, Privacy Act, and Spam Act govern ebook sales.\n- Have an incident response plan before you need it.\n\nSecurity is solid. Next: scaling the workforce and adding new capabilities.\n"}, {"number": 15, "title": "Chapter 15: Scaling the Workforce", "content": "# Chapter 15: Scaling the Workforce\n\n*Adding new agents, parallel execution, queue-based architecture, and multi-project isolation.*\n\n---\n\n## The scaling challenge\n\nFifteen agents handle one project well. But what happens when you have ten projects running simultaneously? Or a hundred? Or when you want to add a sixteenth agent that generates audiobook scripts?\n\nScaling the workforce requires thinking about three dimensions:\n\n1. **Horizontal scaling:** More projects running concurrently\n2. **Vertical scaling:** More agents in the pipeline\n3. **Depth scaling:** More complex individual agents\n\n## Adding new agents\n\nThe workforce is designed for extension. Adding a new agent follows a strict protocol:\n\n### Step 1: Define the agent contract\n\n```python\nclass AudiobookScriptAgent(BaseAgent):\n    name = \"audiobook_script\"\n    version = \"1.0.0\"\n    \n    def __init__(self):\n        super().__init__()\n        self.input_schema = ManuscriptInput\n        self.output_schema = AudiobookScriptOutput\n```\n\n### Step 2: Declare dependencies\n\n```python\n@property\ndef dependencies(self) -> list[str]:\n    return [\"manuscript_author\", \"editorial_agent\"]\n```\n\nThe new agent declares it needs the manuscript and editorial report. The workflow service ensures these complete first.\n\n### Step 3: Implement execution\n\n```python\nasync def execute(self, context: AgentContext) -> AgentResult:\n    manuscript = context.artifacts[\"manuscript_author\"]\n    editorial_notes = context.artifacts[\"editorial_agent\"]\n    \n    script = await self.generate_audiobook_script(\n        manuscript=manuscript,\n        editorial_notes=editorial_notes,\n        voice_profile=context.config.get(\"voice_profile\", \"neutral_aussie\")\n    )\n    \n    return AgentResult(\n        status=\"completed\",\n        artifacts={\"audiobook_script\": script},\n        metrics={\"duration\": script.duration, \"word_count\": script.word_count}\n    )\n```\n\n### Step 4: Register in the pipeline\n\n```python\nagents = [\n    # ... existing 15 agents ...\n    AudiobookScriptAgent(),  # new agent\n]\n```\n\nThe workflow service automatically detects the new agent and integrates it into the dependency graph.\n\n### Step 5: Write tests\n\n```python\n@pytest.mark.asyncio\nasync def test_audiobook_script_agent():\n    agent = AudiobookScriptAgent()\n    context = AgentContext(\n        project_id=\"test-123\",\n        artifacts={\n            \"manuscript_author\": mock_manuscript(),\n            \"editorial_agent\": mock_editorial_notes()\n        }\n    )\n    \n    result = await agent.execute(context)\n    \n    assert result.status == \"completed\"\n    assert \"audiobook_script\" in result.artifacts\n    assert result.artifacts[\"audiobook_script\"].duration > 0\n```\n\n## Parallel execution\n\nSome agents have no dependencies on each other and can run concurrently. The workflow service detects these opportunities automatically:\n\n### Dependency graph analysis\n\n```\nProductDirector \u2192 MarketResearcher \u2192 OpportunityScorer \u2192 PositioningStrategist\n                                                        \u2193\n                                              \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                                              \u2193                   \u2193\n                                    OutlineArchitect      CoverCreativeDirector\n                                              \u2193\n                                    ManuscriptAuthor\n                                              \u2193\n                                    EditorialAgent \u2190 FactCheckComplianceAgent\n                                              \u2193\n                                    EbookProductionAgent\n                                              \u2193\n                                    SalesCopywriter \u2190 FulfilmentAgent\n                                              \u2193\n                                    AnalyticsOptimisationAgent\n                                              \u2193\n                                    ObsidianKnowledgeManager\n                                              \u2193\n                                    LaunchStrategist\n```\n\nThe workflow service identifies that `CoverCreativeDirector` and `OutlineArchitect` can run in parallel after `PositioningStrategist` completes. Similarly, `SalesCopywriter` and `FulfilmentAgent` can run in parallel after `EbookProductionAgent`.\n\n### Parallel execution implementation\n\n```python\nasync def execute_parallel_group(self, agents: list[BaseAgent], context: AgentContext):\n    tasks = [agent.execute(context) for agent in agents]\n    results = await asyncio.gather(*tasks, return_exceptions=True)\n    \n    for agent, result in zip(agents, results):\n        if isinstance(result, Exception):\n            await self._handle_failure(agent, result, context)\n        else:\n            context.artifacts[agent.name] = result.artifacts\n    \n    return context\n```\n\n### Performance impact\n\nParallel execution reduces total pipeline time by 15-20% for a full 15-agent run. The savings increase as more agents are added to parallel groups.\n\n## Queue-based architecture\n\nFor high-volume workloads, a simple in-memory queue isn't sufficient. The workforce supports pluggable queue backends:\n\n### Local queue (default)\n\n```python\nclass LocalQueue:\n    \"\"\"In-memory queue for single-instance deployments.\"\"\"\n    \n    def __init__(self):\n        self._queue: asyncio.Queue = asyncio.Queue()\n    \n    async def enqueue(self, job: PipelineJob):\n        await self._queue.put(job)\n    \n    async def dequeue(self) -> PipelineJob:\n        return await self._queue.get()\n```\n\n### Redis queue (production)\n\n```python\nclass RedisQueue:\n    \"\"\"Redis-backed queue for multi-instance deployments.\"\"\"\n    \n    def __init__(self, redis_url: str):\n        self.redis = aioredis.from_url(redis_url)\n    \n    async def enqueue(self, job: PipelineJob):\n        await self.redis.lpush(\"pipeline:queue\", job.json())\n    \n    async def dequeue(self) -> PipelineJob:\n        _, data = await self.redis.brpop(\"pipeline:queue\", timeout=30)\n        return PipelineJob.parse_raw(data)\n```\n\n### Queue workers\n\n```python\nclass QueueWorker:\n    def __init__(self, queue: QueueBackend, workflow_service: WorkflowService):\n        self.queue = queue\n        self.workflow = workflow_service\n    \n    async def run(self):\n        while True:\n            job = await self.queue.dequeue()\n            asyncio.create_task(self.process_job(job))\n    \n    async def process_job(self, job: PipelineJob):\n        try:\n            result = await self.workflow.run_full_pipeline(job.project_id)\n            await self.queue.ack(job, result)\n        except Exception as e:\n            await self.queue.nack(job, error=str(e))\n```\n\nMultiple workers can run concurrently, each processing jobs from the same queue. This scales horizontally by adding more worker instances.\n\n## Multi-project isolation\n\nWhen running multiple projects simultaneously, isolation is critical. A failure in one project must not affect others.\n\n### Database isolation\n\nEach project has its own database row with a unique ID. All artifacts are scoped to the project:\n\n```python\nclass Project(Base):\n    __tablename__ = \"projects\"\n    \n    id = Column(String, primary_key=True)\n    status = Column(String, default=\"created\")\n    created_at = Column(DateTime, default=datetime.utcnow)\n    updated_at = Column(DateTime, onupdate=datetime.utcnow)\n\nclass Artifact(Base):\n    __tablename__ = \"artifacts\"\n    \n    id = Column(String, primary_key=True)\n    project_id = Column(String, ForeignKey(\"projects.id\"))\n    agent_name = Column(String)\n    data = Column(JSON)\n    created_at = Column(DateTime, default=datetime.utcnow)\n```\n\n### Resource isolation\n\nEach project runs in its own asyncio task with isolated error handling:\n\n```python\nasync def run_project(self, project_id: str):\n    try:\n        async with self.project_semaphore:  # limits concurrent projects\n            result = await self.workflow.run_full_pipeline(project_id)\n            await self._notify_completion(project_id, result)\n    except Exception as e:\n        await self._handle_project_failure(project_id, e)\n```\n\nThe semaphore limits concurrent projects to prevent resource exhaustion. If you're running on a small VPS, you might limit to 3-5 concurrent projects. On a larger server, 20-50.\n\n### Storage isolation\n\nEach project's artifacts are stored in a dedicated directory:\n\n```\n/data/projects/{project_id}/\n\u251c\u2500\u2500 manuscript.md\n\u251c\u2500\u2500 editorial_report.json\n\u251c\u2500\u2500 cover_brief.json\n\u251c\u2500\u2500 epub/\n\u2502   \u2514\u2500\u2500 book.epub\n\u251c\u2500\u2500 pdf/\n\u2502   \u2514\u2500\u2500 book.pdf\n\u2514\u2500\u2500 metadata.json\n```\n\nThis prevents filename collisions and makes cleanup straightforward \u2014 delete the directory, and the project's artifacts are gone.\n\n## Performance optimisation\n\n### Caching\n\nExpensive operations are cached to avoid redundant work:\n\n```python\nclass ResearchCache:\n    def __init__(self, ttl: int = 3600):\n        self.ttl = ttl\n        self.cache: dict[str, CacheEntry] = {}\n    \n    async def get_or_fetch(self, key: str, fetch_fn) -> Any:\n        if key in self.cache and not self.cache[key].expired():\n            return self.cache[key].data\n        \n        data = await fetch_fn()\n        self.cache[key] = CacheEntry(data, ttl=self.ttl)\n        return data\n```\n\nMarket research data is cached for 24 hours. If two projects target the same niche, the second project reuses the first's research instead of re-fetching.\n\n### Connection pooling\n\nDatabase and API connections are pooled to avoid the overhead of establishing new connections:\n\n```python\nfrom sqlalchemy.pool import QueuePool\n\nengine = create_engine(\n    DATABASE_URL,\n    poolclass=QueuePool,\n    pool_size=10,\n    max_overflow=20,\n    pool_timeout=30\n)\n```\n\n### Lazy loading\n\nLarge artifacts (manuscripts, images) are loaded on demand, not kept in memory:\n\n```python\nclass LazyArtifact:\n    def __init__(self, project_id: str, artifact_name: str):\n        self.project_id = project_id\n        self.artifact_name = artifact_name\n        self._data = None\n    \n    @property\n    def data(self):\n        if self._data is None:\n            self._data = self._load_from_disk()\n        return self._data\n```\n\n## Monitoring at scale\n\nWhen running multiple projects, monitoring becomes critical:\n\n### Per-project metrics\n\n```\nProject abc123:\n  Status: IN_PROGRESS\n  Current agent: editorial_agent\n  Agents completed: 8/15\n  Time in current agent: 45s\n  Estimated completion: 12 minutes\n```\n\n### Aggregate metrics\n\n```\nSystem overview:\n  Active projects: 12\n  Completed today: 8\n  Failed today: 1\n  Average pipeline time: 18.3 minutes\n  Queue depth: 3\n  Worker utilisation: 78%\n```\n\n### Alerting thresholds\n\n```yaml\nalerts:\n  - name: QueueBacklog\n    condition: queue_depth > 10 for 15 minutes\n    action: scale_up_workers\n    \n  - name: ProjectStuck\n    condition: project_in_same_agent > 600s\n    action: notify_admin\n    \n  - name: HighFailureRate\n    condition: failure_rate > 10% in 1 hour\n    action: pause_new_projects\n```\n\n## Key takeaways\n\n- Adding a new agent is a 5-step process: define contract, declare dependencies, implement execution, register, test.\n- Parallel execution reduces pipeline time by 15-20%.\n- Queue-based architecture enables horizontal scaling.\n- Multi-project isolation prevents cascading failures.\n- Caching, connection pooling, and lazy loading optimise performance.\n- Per-project and aggregate monitoring enable operational visibility.\n\nYour workforce can scale. Next: the future of Fair Dinkum Publishing.\n"}, {"number": 16, "title": "Chapter 16: The Future", "content": "# Chapter 16: The Future\n\n*Roadmap, community contributions, monetisation models, and keeping it fair dinkum in the age of AI publishing.*\n\n---\n\n## Where we've been\n\nThis book has taken you from a blank directory to a fully operational AI agent workforce that can research, write, edit, produce, and sell ebooks \u2014 all from a local-first architecture that respects your privacy and your pocket.\n\nBut technology doesn't stand still. The AI publishing landscape is evolving fast, and the Fair Dinkum workforce is designed to evolve with it.\n\n## The roadmap\n\n### Phase 1: Foundation (current)\n\n- 15 specialised agents covering the full ebook pipeline\n- Local-first architecture with FastAPI MCP server\n- Stripe integration for payments and subscriptions\n- Obsidian vault publishing for knowledge management\n- Docker deployment with CI/CD\n\n### Phase 2: Expansion (next 6 months)\n\n- **Audiobook agent:** Convert manuscripts to audiobook scripts with voice synthesis\n- **Translation agent:** Localise ebooks for international markets (starting with US English)\n- **Print-on-demand agent:** Generate print-ready interiors and covers for paperback distribution\n- **Video summary agent:** Create short-form video content for social media promotion\n- **Community agent:** Manage reader communities, collect feedback, and identify upsell opportunities\n\n### Phase 3: Platform (6-12 months)\n\n- **Multi-tenant architecture:** Let other authors run their own workforce instances\n- **Template library:** Pre-built agent configurations for common genres (how-to, memoir, fiction, technical)\n- **Marketplace:** Buy and sell agent prompts, style guides, and niche research\n- **Analytics dashboard:** Web-based UI for monitoring projects across multiple workforces\n\n### Phase 4: Ecosystem (12-24 months)\n\n- **Integration marketplace:** Connect with third-party tools (email platforms, social schedulers, design tools)\n- **Collaborative editing:** Real-time co-authoring between humans and AI agents\n- **Quality certification:** Automated quality scoring that becomes a trust signal for readers\n- **Industry benchmarks:** Anonymised aggregate data on what works in Australian self-publishing\n\n## Community contributions\n\nOpen source only works with community. The Fair Dinkum workforce is designed for contribution:\n\n### How to contribute\n\n1. **Bug reports:** Found a problem? Open an issue with steps to reproduce.\n2. **Feature requests:** Have an idea? Open an issue describing the use case.\n3. **Agent contributions:** Built a new agent? Submit a pull request with tests.\n4. **Documentation:** Found something unclear? Submit a docs improvement.\n5. **Translations:** Help make the workforce accessible to non-English speakers.\n\n### Contribution guidelines\n\nEvery contribution must:\n\n- Include tests that verify the change works\n- Not break existing tests (CI must pass)\n- Follow the existing code style (Black formatting, type hints)\n- Include documentation for any new public APIs\n- Respect the local-first philosophy \u2014 no forced cloud dependencies\n\n### Recognition\n\nContributors are recognised in three ways:\n\n- **CONTRIBUTORS.md:** All contributors listed in the project root\n- **Release notes:** Significant contributions highlighted in release announcements\n- **Revenue share:** Contributors to revenue-generating features receive a percentage of net revenue for 12 months\n\n## Monetisation models\n\nThe Fair Dinkum workforce is open source, but open source doesn't mean \"can't make money.\" Several monetisation models are compatible with the architecture:\n\n### Model 1: Consulting and setup\n\nHelp other authors deploy and customise their own workforce instances.\n\n- **Setup package:** $500 for initial deployment and configuration\n- **Custom agent development:** $2,000-5,000 per custom agent\n- **Monthly maintenance:** $200/month for updates, monitoring, and support\n\n### Model 2: Training and courses\n\nTeach other authors how to use the workforce effectively.\n\n- **Online course:** $197 for a self-paced video course\n- **Live workshops:** $497 for a weekend intensive\n- **Corporate training:** Custom pricing for publishing companies\n\n### Model 3: SaaS wrapper\n\nOffer a hosted version for authors who don't want to self-host.\n\n- **Starter:** $29/month \u2014 up to 3 projects, 5 agents\n- **Professional:** $79/month \u2014 up to 20 projects, all agents\n- **Enterprise:** $199/month \u2014 unlimited projects, custom agents, priority support\n\nThe SaaS wrapper uses the same open-source core but adds managed hosting, automatic backups, and premium support.\n\n### Model 4: Marketplace fees\n\nTake a percentage of transactions through the agent marketplace.\n\n- **Template sales:** 30% platform fee on prompt and style guide sales\n- **Research sales:** 20% platform fee on niche research packages\n- **Agent sales:** 15% platform fee on custom agent sales\n\n### Model 5: Certification and trust\n\nCharge for quality certification that becomes a signal to readers.\n\n- **Quality audit:** $100 per ebook \u2014 automated quality assessment with improvement recommendations\n- **Certification badge:** $50/year \u2014 display a \"Fair Dinkum Certified\" badge on certified ebooks\n- **Trust ranking:** Free for authors, licensing fee for platforms that want to display certification data\n\n## Keeping it fair dinkum\n\nAs AI-generated content floods the market, trust becomes the scarcest resource. The Fair Dinkum philosophy is built on three principles:\n\n### 1. Transparency\n\nEvery ebook produced by the workforce includes an \"About this book\" section that discloses:\n\n- Which parts were AI-generated and which were human-edited\n- What research sources were informed the content\n- When the book was last updated\n\nThis isn't a weakness \u2014 it's a competitive advantage. Readers increasingly want to know what they're buying.\n\n### 2. Quality over quantity\n\nThe workforce is designed to produce fewer, better books \u2014 not a flood of mediocre content. The editorial agent, fact-checker, and human gates exist specifically to prevent low-quality output from reaching readers.\n\nIf a book doesn't meet quality thresholds, it doesn't ship. Simple as that.\n\n### 3. Author ownership\n\nThe workforce serves the author, not the platform. You own your content, your data, and your customer relationships. There's no exclusivity requirement, no platform lock-in, and no claim on your intellectual property.\n\nIf you want to take your content and leave, you can. All your data is exportable in open formats.\n\n## The Australian angle\n\nAustralia has unique advantages in the AI publishing landscape:\n\n### Time zone\n\nWhen it's business hours in Australia, it's night in the US and morning in Europe. Australian authors can respond to US market trends overnight and European trends in the morning.\n\n### English-speaking market\n\nAustralia is part of the global English-language market, which is the largest ebook market in the world. No translation needed for the biggest audience.\n\n### Trusted brand\n\nAustralian products carry a quality perception globally. \"Made in Australia\" signals craftsmanship and authenticity \u2014 an advantage in a market flooded with cheap AI-generated content.\n\n### Small but connected\n\nAustralia's small population means tight networks. Word-of-mouth travels fast. A few successful authors recommending the workforce can saturate the Australian self-publishing community quickly.\n\n## What success looks like\n\n### 12-month targets\n\n- 100 active workforce instances (self-hosted or SaaS)\n- 500 ebooks published using the workforce\n- $50,000 in total author revenue facilitated\n- 5 community-contributed agents merged\n- 1 industry conference talk or workshop\n\n### 24-month targets\n\n- 500 active workforce instances\n- 2,500 ebooks published\n- $250,000 in total author revenue facilitated\n- 20 community-contributed agents\n- SaaS wrapper launched and cashflow-positive\n\n### 5-year vision\n\n- The Fair Dinkum workforce becomes the standard tool for Australian self-publishing\n- A thriving marketplace of agents, templates, and research\n- A new generation of Australian authors who treat publishing as a profession, not a hobby\n- A model other countries adapt for their own local publishing ecosystems\n\n## Your next step\n\nYou've read the book. You've seen the code. You understand the architecture. Now it's time to build.\n\nStart small. Pick one niche. Run the pipeline in mock mode. See what the workforce produces. Iterate on the prompts. Upgrade to live agents one at a time. Publish your first ebook.\n\nThen publish another.\n\nAnd another.\n\nBefore you know it, you'll have a catalogue, a readership, and a machine that writes.\n\nWelcome to the future of Australian publishing.\n\nLet's get to work.\n"}];

let currentChapter = 0;
let fontSize = 17;
let sidebarVisible = true;

function renderTOC() {
    const toc = document.getElementById('toc');
    chapters.forEach((ch, i) => {
        const a = document.createElement('a');
        a.className = 'toc-item' + (i === currentChapter ? ' active' : '');
        a.innerHTML = '<span class="num">' + String(ch.number).padStart(2, '0') + '</span> ' + ch.title.replace(/^(\d+\s*[\u2014-]\s*)/, '').replace('Chapter ' + ch.number + ': ', '');
        a.onclick = () => loadChapter(i);
        toc.appendChild(a);
    });
}

function loadChapter(index) {
    currentChapter = index;
    const ch = chapters[index];
    document.getElementById('content').innerHTML = marked.parse(ch.content);
    document.getElementById('topbarTitle').textContent = ch.title;
    document.querySelectorAll('.toc-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
    });
    document.getElementById('prevBtn').disabled = index === 0;
    document.getElementById('nextBtn').disabled = index === chapters.length - 1;
    document.getElementById('content').scrollTop = 0;
    window.location.hash = 'ch' + ch.number;
}

function navigate(dir) {
    const next = currentChapter + dir;
    if (next >= 0 && next < chapters.length) {
        loadChapter(next);
    }
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
}

function toggleSidebar() {
    sidebarVisible = !sidebarVisible;
    document.querySelector('.sidebar').style.display = sidebarVisible ? 'flex' : 'none';
}

function changeFontSize(delta) {
    fontSize = Math.max(13, Math.min(24, fontSize + delta));
    document.querySelector('.content p').style.fontSize = fontSize + 'px';
    localStorage.setItem('fontSize', fontSize);
}

document.getElementById('content').addEventListener('scroll', function() {
    const el = this;
    const progress = el.scrollTop / (el.scrollHeight - el.clientHeight);
    document.getElementById('progressBar').style.width = (progress * 100) + '%';
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 't') toggleTheme();
    if (e.key === 'b') toggleSidebar();
});

const savedTheme = localStorage.getItem('theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
const savedFontSize = localStorage.getItem('fontSize');
if (savedFontSize) {
    fontSize = parseInt(savedFontSize);
    document.styleSheets[0].insertRule('.content p { font-size: ' + fontSize + 'px; }', 0);
}

const hash = window.location.hash;
if (hash.startsWith('#ch')) {
    const num = parseInt(hash.replace('#ch', ''));
    const idx = chapters.findIndex(ch => ch.number === num);
    if (idx >= 0) currentChapter = idx;
}

renderTOC();
loadChapter(currentChapter);
</script>
