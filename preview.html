@staticmethod\n    def add_chapter(db: Session, outline_id: str, title: str, order: int, summary: str = None, estimated_word_count: int = None) -> Chapter:\n        chapter = Chapter(\n            outline_id=outline_id,\n            title=title,\n            summary=summary,\n            order=order,\n            estimated_word_count=estimated_word_count,\n        )\n        db.add(chapter)\n        db.commit()\n        db.refresh(chapter)\n        return chapter\n\n    @staticmethod\n    def get_by_project(db: Session, project_id: str) -> Outline:\n        return db.query(Outline).filter(Outline.project_id == project_id).first()\n\n\nclass ManuscriptRepository:\n    @staticmethod\n    def create(db: Session, project_id: str, title: str) -> Manuscript:\n        manuscript = Manuscript(project_id=project_id, title=title)\n        db.add(manuscript)\n        db.commit()\n        db.refresh(manuscript)\n        return manuscript\n\n    @staticmethod\n    def add_section(db: Session, manuscript_id: str, title: str, order: int, content: str = None, chapter_id: str = None) -> Section:\n        section = Section(\n            manuscript_id=manuscript_id,\n            title=title,\n            order=order,\n            content=content,\n            chapter_id=chapter_id,\n        )\n        db.add(section)\n        db.commit()\n        db.refresh(section)\n        return section\n\n    @staticmethod\n    def get_by_project(db: Session, project_id: str) -> Manuscript:\n        return db.query(Manuscript).filter(Manuscript.project_id == project_id).first()\n\n\nclass ArtifactRepository:\n    @staticmethod\n    def create(db: Session, project_id: str, artifact_type: str, file_path: str = None, mime_type: str = None, metadata: dict = None) -> Artifact:\n        artifact = Artifact(\n            project_id=project_id,\n            artifact_type=artifact_type,\n            file_path=file_path,\n            mime_type=mime_type,\n            metadata_json=json.dumps(metadata) if metadata else None,\n        )\n        db.add(artifact)\n        db.commit()\n        db.refresh(artifact)\n        return artifact\n\n    @staticmethod\n    def get_by_project_and_type(db: Session, project_id: str, artifact_type: str) -> Artifact:\n        return db.query(Artifact).filter(\n            Artifact.project_id == project_id,\n            Artifact.artifact_type == artifact_type,\n        ).first()\n\n    @staticmethod\n    def list_by_project(db: Session, project_id: str) -> list[Artifact]:\n        return db.query(Artifact).filter(Artifact.project_id == project_id).all()\n```\n\nThe repository layer has a clear contract. Each method takes a `Session` as its first argument, performs a single logical operation, and returns a model instance. Agents never call `db.add()` or `db.commit()` directly \u2014 they delegate to repositories.\n\n---\n\n## Alembic setup\n\nAlembic manages database schema versions. It generates migration scripts when you change models and applies them in order.\n\nIf you haven\u2019t already, initialise Alembic:\n\n```bash\nalembic init alembic\n```\n\nThis creates an `alembic/` directory with `env.py`, `script.py.mako`, and `README`.\n\nEdit `alembic.ini` to point at your database:\n\n```ini\n[alembic]\nscript_location = alembic\nsqlalchemy.url = sqlite:///./data/app.db\n```\n\nFor production, you\u2019d use a dynamic URL from an environment variable. For development, a hardcoded SQLite path is fine.\n\nEdit `alembic/env.py` to import your models. Find the line that says `target_metadata = None` and replace it with:\n\n```python\nfrom app.models import Base\ntarget_metadata = Base.metadata\n```\n\nAlso update the import section at the top of `env.py`:\n\n```python\nfrom logging.config import fileConfig\nfrom sqlalchemy import engine_from_config, pool\nfrom alembic import context\nfrom app.models import Base\n```\n\nGenerate the first migration:\n\n```bash\nalembic revision --autogenerate -m \"Initial project models\"\n```\n\nThis inspects your models and generates a migration script in `alembic/versions/`.\n\nApply it:\n\n```bash\nalembic upgrade head\n```\n\nYou should see output like `INFO  [alembic.runtime.migration] Context impl SQLiteImpl.`\n\nCheck that the tables exist:\n\n```bash\npython3 -c \"from app.core.database import engine; print(engine.table_names())\"\n```\n\nYou should see: `projects`, `opportunity_scores`, `outlines`, `chapters`, `manuscripts`, `sections`, `artifacts`, and `alembic_version`.\n\n---\n\n## Test the database layer\n\nCreate `tests/test_database.py`:\n\n```python\nimport os\nimport sys\nimport pytest\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom app.core.database import Base, engine, SessionLocal, get_db\nfrom app.models.project import Project, ProjectStatus\nfrom app.models.opportunity import OpportunityScore\nfrom app.models.outline import Outline, Chapter\nfrom app.models.manuscript import Manuscript, Section\nfrom app.models.artifact import Artifact\nfrom app.core.repositories import (\n    ProjectRepository, OpportunityRepository,\n    OutlineRepository, ManuscriptRepository, ArtifactRepository,\n)\n\n\n@pytest.fixture(autouse=True)\ndef setup_db():\n    \"\"\"Create tables before each test and drop after.\"\"\"\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\ndef test_create_project():\n    db = SessionLocal()\n    project = ProjectRepository.create(db, \"proj-1\", \"Australian Gardening\", \"gardening\", \"A guide to native plants\")\n    assert project.id == \"proj-1\"\n    assert project.status == ProjectStatus.briefed\n    db.close()\n\n\ndef test_project_status_transitions():\n    db = SessionLocal()\n    project = ProjectRepository.create(db, \"proj-2\", \"Test Book\", \"test\")\n    ProjectRepository.update_status(db, \"proj-2\", ProjectStatus.research_complete)\n    updated = ProjectRepository.get(db, \"proj-2\")\n    assert updated.status == ProjectStatus.research_complete\n    db.close()\n\n\ndef test_opportunity_score():\n    db = SessionLocal()\n    ProjectRepository.create(db, \"proj-3\", \"Test\", \"test\")\n    score = OpportunityRepository.create(db, \"proj-3\", demand_score=85, competition_score=40)\n    assert score.demand_score == 85\n    db.close()\n\n\ndef test_outline_and_chapters():\n    db = SessionLocal()\n    ProjectRepository.create(db, \"proj-4\", \"Test\", \"test\")\n    outline = OutlineRepository.create(db, \"proj-4\", \"Test Outline\", \"A summary\", 5000)\n    chapter = OutlineRepository.add_chapter(db, outline.id, \"Chapter 1\", 1, \"First chapter\", 2000)\n    assert chapter.title == \"Chapter 1\"\n    assert chapter.order == 1\n    db.close()\n\n\ndef test_manuscript_and_sections():\n    db = SessionLocal()\n    ProjectRepository.create(db, \"proj-5\", \"Test\", \"test\")\n    manuscript = ManuscriptRepository.create(db, \"proj-5\", \"Test Manuscript\")\n    section = ManuscriptRepository.add_section(db, manuscript.id, \"Section 1\", 1, \"Content here\")\n    assert section.content == \"Content here\"\n    db.close()\n\n\ndef test_artifact():\n    db = SessionLocal()\n    ProjectRepository.create(db, \"proj-6\", \"Test\", \"test\")\n    artifact = ArtifactRepository.create(db, \"proj-6\", \"cover\", \"/path/to/cover.png\", \"image/png\", {\"style\": \"minimal\"})\n    assert artifact.artifact_type == \"cover\"\n    db.close()\n\n\ndef test_list_projects():\n    db = SessionLocal()\n    ProjectRepository.create(db, \"proj-a\", \"A\", \"a\")\n    ProjectRepository.create(db, \"proj-b\", \"B\", \"b\")\n    projects = ProjectRepository.list(db, limit=10)\n    assert len(projects) == 2\n    db.close()\n```\n\nRun the tests:\n\n```bash\npython3 -m pytest tests/test_database.py -v\n```\n\nExpected output: all seven tests pass.\n\n---\n\n## What you\u2019ve built\n\n- Five SQLAlchemy models: Project, OpportunityScore, Outline, Chapter, Manuscript, Section, Artifact\n- A database configuration module with SQLite/PostgreSQL support\n- A repository layer with clean data access methods\n- Alembic migrations for schema versioning\n- Seven database tests that verify CRUD operations\n\nWhat you haven\u2019t built yet:\n- The FastAPI routes that expose this data over HTTP\n- The agents that write to the database\n- The workflow service that orchestrates everything\n- The Stripe and Obsidian integrations\n\n---\n\n## Troubleshooting\n\n**\u201calembic command not found\u201d**\nAlembic is installed as part of your dependencies. If you\u2019re in a venv, make sure it\u2019s activated. If you installed system-wide, it should be in your PATH.\n\n**\u201cNo such table: projects\u201d**\nYou forgot to run `alembic upgrade head`. Run it, or call `Base.metadata.create_all(bind=engine)` in a script to create tables directly.\n\n**\u201cSQLite database is locked\u201d**\nSQLite allows one writer at a time. If you\u2019re running tests in parallel, switch to PostgreSQL or use `pytest -n 1` to serialise tests.\n\n**\u201cForeign key constraint failed\u201d**\nYou\u2019re trying to create a child record before the parent exists. Always create the Project first, then attach OpportunityScore, Outline, and Manuscript to it.\n\n---\n\n## What comes next\n\nChapter 6 builds the FastAPI MCP server. You\u2019ll create the agent routes, project CRUD endpoints, and Stripe integration points. By the end of Chapter 6, you\u2019ll have a working API you can test from your browser and call from the agent workforce.\n\nChapter 7 builds the fifteen agents. You\u2019ll implement each one, wire them to the workflow service, and write tests that verify the end-to-end pipeline.\n\nThe database is the backbone. The API is the nervous system. The agents are the muscles.\n\n---\n\n*End of Chapter 5*\n"}, {"number": 6, "title": "Chapter 6: The FastAPI MCP Server", "content": "# Chapter 6: The FastAPI MCP Server\n\n*Routes, schemas, CORS, health checks, and the agent dispatch mechanism.*\n\n---\n\n## What this server does\n\nThe FastAPI MCP server is the control plane for the entire workforce. It exposes HTTP endpoints that let you:\n- List available agents\n- Execute an agent with a project ID and payload\n- Create, read, and update projects\n- Query Stripe products and stats\n- Check service health\n\nIt\u2019s not a job queue. It\u2019s a dispatcher. When you POST to `/agents/manuscript_author/execute`, the server calls the Manuscript Author\u2019s `execute()` method, passes the project ID and payload, and returns the result. The heavy lifting happens inside the agent, not in the HTTP layer.\n\n---\n\n## Server architecture\n\nThe server lives in `app/api/`. It has three files:\n\n- `app/api/__init__.py` \u2014 the FastAPI app instance, middleware, and router registration\n- `app/api/routes.py` \u2014 all endpoint definitions\n- `app/api/server.py` \u2014 legacy entry point (kept for backwards compatibility)\n\nThe `app/api/__init__.py` file is now the canonical entry point. It creates the app, registers routers, and includes the Stripe endpoints.\n\n---\n\n## Creating the app\n\n`app/api/__init__.py`:\n\n```python\nfrom fastapi import FastAPI\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom app.api.routes import router as agent_router\n\napp = FastAPI(\n    title=\"Fair Dinkum Publishing Agent Workforce\",\n    description=\"MCP server orchestrating the end-to-end ebook production pipeline.\",\n    version=\"0.1.0\",\n)\n\n# CORS middleware for local development\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\"*\"],\n    allow_credentials=True,\n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n)\n\n# Register routers\napp.include_router(agent_router, prefix=\"/agents\", tags=[\"agents\"])\n\n# Stripe router\nfrom fastapi import APIRouter\nstripe_router = APIRouter()\n\n@stripe_router.get(\"/products\", tags=[\"stripe\"])\ndef list_stripe_products():\n    \"\"\"List Stripe products.\"\"\"\n    from app.services.stripe import StripeService\n    return StripeService.list_products()\n\n@stripe_router.get(\"/stats\", tags=[\"stripe\"])\ndef get_stripe_stats():\n    \"\"\"Get Stripe account stats.\"\"\"\n    from app.services.stripe import StripeService\n    return StripeService.get_stats()\n\napp.include_router(stripe_router, prefix=\"/stripe\", tags=[\"stripe\"])\n\n\n@app.get(\"/health\", tags=[\"health\"])\ndef health_check():\n    \"\"\"Health check endpoint.\"\"\"\n    return {\"status\": \"healthy\", \"service\": \"fair-dinkum-publishing-agent-workforce\"}\n\n\n@app.on_event(\"startup\")\ndef startup_event():\n    \"\"\"Initialize resources on startup.\"\"\"\n    pass\n\n\n@app.on_event(\"shutdown\")\ndef shutdown_event():\n    \"\"\"Clean up resources on shutdown.\"\"\"\n    pass\n```\n\nKey points:\n- `CORSMiddleware` allows requests from any origin. This is fine for local development. In production, restrict `allow_origins` to your domain.\n- The `agent_router` handles all agent and project endpoints under `/agents`.\n- The `stripe_router` handles Stripe-specific endpoints under `/stripe`.\n- The `/health` endpoint is unauthenticated so load balancers and monitoring tools can check it.\n\n---\n\n## Agent and project routes\n\n`app/api/routes.py`:\n\n```python\nfrom fastapi import APIRouter, HTTPException\nfrom pydantic import BaseModel\nfrom typing import Optional, Dict, Any\nfrom app.models.project import ProjectStatus\n\nrouter = APIRouter()\n\n\nclass AgentRequest(BaseModel):\n    project_id: str\n    action: str\n    payload: Optional[Dict[str, Any]] = None\n\n\nclass AgentResponse(BaseModel):\n    status: str\n    message: str\n    data: Optional[Dict[str, Any]] = None\n\n\n@router.get(\"/\", tags=[\"agents\"])\ndef list_agents():\n    \"\"\"List all available agents.\"\"\"\n    agents = [\n        \"product_director\", \"market_research\", \"opportunity_scoring\",\n        \"positioning_offer\", \"outline_architect\", \"manuscript_author\",\n        \"editorial\", \"fact_check_compliance\", \"cover_creative_director\",\n        \"ebook_production\", \"sales_copy\", \"funnel_fulfillment\",\n        \"analytics_optimisation\", \"obsidian_knowledge_manager\", \"launch_strategist\"\n    ]\n    return {\"agents\": agents, \"count\": len(agents)}\n\n\n@router.post(\"/{agent_name}/execute\", response_model=AgentResponse, tags=[\"agents\"])\ndef execute_agent(agent_name: str, request: AgentRequest):\n    \"\"\"Execute a specific agent workflow step.\"\"\"\n    valid_agents = [\n        \"product_director\", \"market_research\", \"opportunity_scoring\",\n        \"positioning_offer\", \"outline_architect\", \"manuscript_author\",\n        \"editorial\", \"fact_check_compliance\", \"cover_creative_director\",\n        \"ebook_production\", \"sales_copy\", \"funnel_fulfillment\",\n        \"analytics_optimisation\", \"obsidian_knowledge_manager\", \"launch_strategist\"\n    ]\n\n    if agent_name not in valid_agents:\n        raise HTTPException(status_code=404, detail=f\"Agent '{agent_name}' not found\")\n\n    # In production, this would dispatch to the actual agent\n    return AgentResponse(\n        status=\"success\",\n        message=f\"Agent '{agent_name}' executed for project '{request.project_id}'\",\n        data={\"agent\": agent_name, \"project_id\": request.project_id}\n    )\n\n\n@router.post(\"/projects\", tags=[\"projects\"])\ndef create_project(project_id: str, title: str, niche: str, product_brief: Optional[str] = None):\n    \"\"\"Create a new project.\"\"\"\n    from app.core.database import get_db\n    from app.core.repositories import ProjectRepository\n    \n    db = next(get_db())\n    project = ProjectRepository.create(\n        db=db,\n        project_id=project_id,\n        title=title,\n        niche=niche,\n        product_brief=product_brief\n    )\n    return {\n        \"status\": \"success\",\n        \"message\": \"Project created\",\n        \"data\": {\n            \"id\": project.id,\n            \"title\": project.title,\n            \"niche\": project.niche,\n            \"status\": project.status.value\n        }\n    }\n\n\n@router.get(\"/projects/{project_id}\", tags=[\"projects\"])\ndef get_project(project_id: str):\n    \"\"\"Get project details.\"\"\"\n    from app.core.database import get_db\n    from app.core.repositories import ProjectRepository\n    \n    db = next(get_db())\n    project = ProjectRepository.get(db, project_id)\n    if not project:\n        raise HTTPException(status_code=404, detail=\"Project not found\")\n    \n    return {\n        \"status\": \"success\",\n        \"data\": {\n            \"id\": project.id,\n            \"title\": project.title,\n            \"niche\": project.niche,\n            \"status\": project.status.value,\n            \"product_brief\": project.product_brief,\n            \"positioning_statement\": project.positioning_statement,\n            \"outline\": project.outline,\n            \"manuscript_path\": project.manuscript_path,\n            \"cover_path\": project.cover_path,\n            \"ebook_path\": project.ebook_path,\n            \"sales_copy_path\": project.sales_copy_path,\n            \"funnel_url\": project.funnel_url,\n            \"stripe_payment_link\": project.stripe_payment_link,\n            \"obsidian_note_path\": project.obsidian_note_path,\n            \"created_at\": str(project.created_at),\n            \"updated_at\": str(project.updated_at),\n            \"version\": project.version\n        }\n    }\n\n\n@router.patch(\"/projects/{project_id}/status\", tags=[\"projects\"])\ndef update_project_status(project_id: str, status: str):\n    \"\"\"Update project status.\"\"\"\n    from app.core.database import get_db\n    from app.core.repositories import ProjectRepository\n    \n    try:\n        new_status = ProjectStatus(status)\n    except ValueError:\n        raise HTTPException(status_code=400, detail=f\"Invalid status: {status}\")\n    \n    db = next(get_db())\n    project = ProjectRepository.update_status(db, project_id, new_status)\n    if not project:\n        raise HTTPException(status_code=404, detail=\"Project not found\")\n    \n    return {\n        \"status\": \"success\",\n        \"message\": f\"Project status updated to {status}\",\n        \"data\": {\"id\": project.id, \"status\": project.status.value}\n    }\n```\n\nThis file defines:\n- `GET /` \u2014 list all agents\n- `POST /{agent_name}/execute` \u2014 execute an agent\n- `POST /projects` \u2014 create a project\n- `GET /projects/{project_id}` \u2014 read a project\n- `PATCH /projects/{project_id}/status` \u2014 update project status\n\nThe `next(get_db())` pattern gets a database session from the FastAPI dependency. It\u2019s the standard way to inject database access into route handlers.\n\n---\n\n## Pydantic schemas\n\nPydantic models define the shape of request and response data. They\u2019re not just validation \u2014 they\u2019re documentation. FastAPI uses them to generate the OpenAPI schema at `/docs`.\n\n**AgentRequest** validates that every agent execution request includes a `project_id` and optionally an `action` and `payload`.\n\n**AgentResponse** ensures every agent response includes `status`, `message`, and optional `data`.\n\nIn production, you\u2019d expand these schemas with more specific models. For example, `ExecuteManuscriptRequest` would have fields for `chapter_ids`, `style`, and `temperature`. The generic `AgentRequest` works for now because the actual agent logic lives in Python, not in the API schema.\n\n---\n\n## Stripe routes\n\nThe Stripe router lives in `app/api/__init__.py`. It provides two endpoints:\n\n`GET /stripe/products`\nReturns a list of Stripe products or a graceful error if the API key isn\u2019t configured.\n\n`GET /stripe/stats`\nReturns active subscription count, recent revenue, and available balance.\n\nThese endpoints are thin wrappers around `StripeService`. They\u2019re designed for quick integration and debugging, not for public consumption. In production, you\u2019d add authentication.\n\n---\n\n## Testing the API\n\nCreate `tests/test_api_integration.py`:\n\n```python\nimport os\nimport sys\nimport pytest\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom fastapi.testclient import TestClient\nfrom app.api import app\nfrom app.core.database import Base, engine\n\nclient = TestClient(app)\n\n\n@pytest.fixture(autouse=True)\ndef setup_db():\n    \"\"\"Create tables before each test.\"\"\"\n    Base.metadata.create_all(bind=engine)\n    yield\n    Base.metadata.drop_all(bind=engine)\n\n\ndef test_health_check():\n    response = client.get(\"/health\")\n    assert response.status_code == 200\n    assert response.json()[\"status\"] == \"healthy\"\n\n\ndef test_list_agents():\n    response = client.get(\"/agents/\")\n    assert response.status_code == 200\n    data = response.json()\n    assert \"agents\" in data\n    assert len(data[\"agents\"]) == 15\n\n\ndef test_create_project():\n    response = client.post(\"/agents/projects?project_id=test-1&title=Test Book&niche=gardening\")\n    assert response.status_code == 200\n    data = response.json()\n    assert data[\"status\"] == \"success\"\n    assert data[\"data\"][\"id\"] == \"test-1\"\n\n\ndef test_get_project():\n    client.post(\"/agents/projects?project_id=test-2&title=Test&niche=test\")\n    response = client.get(\"/agents/projects/test-2\")\n    assert response.status_code == 200\n    data = response.json()\n    assert data[\"data\"][\"title\"] == \"Test\"\n\n\ndef test_get_project_not_found():\n    response = client.get(\"/agents/projects/nonexistent\")\n    assert response.status_code == 404\n\n\ndef test_update_project_status():\n    client.post(\"/agents/projects?project_id=test-3&title=Test&niche=test\")\n    response = client.patch(\"/agents/projects/test-3/status?status=research_complete\")\n    assert response.status_code == 200\n    data = response.json()\n    assert data[\"data\"][\"status\"] == \"research_complete\"\n\n\ndef test_execute_agent():\n    response = client.post(\"/agents/product_director/execute\", json={\n        \"project_id\": \"test-4\",\n        \"action\": \"plan\",\n        \"payload\": {}\n    })\n    assert response.status_code == 200\n    data = response.json()\n    assert data[\"status\"] == \"success\"\n    assert \"product_director\" in data[\"message\"]\n\n\ndef test_execute_invalid_agent():\n    response = client.post(\"/agents/not_an_agent/execute\", json={\n        \"project_id\": \"test-5\",\n        \"action\": \"plan\"\n    })\n    assert response.status_code == 404\n\n\ndef test_stripe_products_endpoint():\n    response = client.get(\"/stripe/products\")\n    assert response.status_code == 200\n    data = response.json()\n    assert \"status\" in data\n\n\ndef test_stripe_stats_endpoint():\n    response = client.get(\"/stripe/stats\")\n    assert response.status_code == 200\n    data = response.json()\n    assert \"status\" in data\n```\n\nRun the tests:\n\n```bash\npython3 -m pytest tests/test_api_integration.py -v\n```\n\nExpected output: all ten tests pass.\n\n---\n\n## OpenAPI documentation\n\nFastAPI automatically generates OpenAPI documentation. Start the server:\n\n```bash\npython3 run_server.py\n```\n\nOpen `http://localhost:8000/docs` in your browser. You\u2019ll see an interactive API explorer. You can click \u201cTry it out\u201d on any endpoint, fill in parameters, and see the response.\n\nThis is one of FastAPI\u2019s best features. You don\u2019t need to write frontend code to test the API. The docs are always in sync with the code because they\u2019re generated from the same Pydantic schemas.\n\n---\n\n## CORS and security\n\nCORS (Cross-Origin Resource Sharing) controls which domains can call your API. The current configuration allows all origins:\n\n```python\nallow_origins=[\"*\"]\n```\n\nThis is fine for local development. For production, restrict it:\n\n```python\nallow_origins=[\"https://yourdomain.com\", \"https://app.yourdomain.com\"]\n```\n\nYou should also add authentication. The current server has no auth layer. Anyone who can reach port 8000 can execute agents, create projects, and read data. In production, add API key validation or OAuth2.\n\nA simple API key middleware:\n\n```python\nfrom fastapi import Request, HTTPException\n\n@app.middleware(\"http\")\nasync def verify_api_key(request: Request, call_next):\n    if request.url.path.startswith(\"/health\"):\n        return await call_next(request)\n    api_key = request.headers.get(\"X-API-Key\")\n    if api_key != os.getenv(\"API_KEY\"):\n        raise HTTPException(status_code=403, detail=\"Invalid API key\")\n    return await call_next(request)\n```\n\nSet `API_KEY` in your `.env` file and you\u2019ve added basic authentication.\n\n---\n\n## Request flow\n\nHere\u2019s what happens when you call `POST /agents/manuscript_author/execute`:\n\n1. FastAPI receives the request and validates the JSON body against `AgentRequest`.\n2. The route handler checks that `manuscript_author` is in the valid agents list.\n3. The handler imports the `ManuscriptAuthor` class.\n4. It creates an instance with the `project_id`.\n5. It calls `agent.execute(**request.payload)`.\n6. The agent reads the project\u2019s outline from the database.\n7. The agent calls the LLM (local or cloud) to generate content.\n8. The agent saves the generated sections to the database via `ManuscriptRepository`.\n9. The agent returns a dict with `status`, `message`, and `data`.\n10. FastAPI serialises the dict into JSON and returns it to the client.\n\nIn the current implementation, step 3\u20139 are mocked. The agent returns a simulated success response. In Chapter 7, we\u2019ll implement the real logic.\n\n---\n\n## What you\u2019ve built\n\n- A FastAPI app with CORS middleware\n- Agent listing and execution endpoints\n- Project CRUD endpoints backed by the repository layer\n- Stripe product and stats endpoints\n- Pydantic request/response schemas\n- Ten integration tests covering all endpoints\n\nWhat you haven\u2019t built yet:\n- The real agent implementations\n- The workflow service that chains agents together\n- Authentication and rate limiting\n- WebSocket support for real-time progress updates\n\n---\n\n## Troubleshooting\n\n**\u201cImportError: cannot import name 'router' from 'app.api.routes'\u201d**\nMake sure `app/api/routes.py` defines `router = APIRouter()` at the module level and that `app/api/__init__.py` imports it correctly.\n\n**\u201cNo module named 'app'\u201d**\nRun tests from the project root directory. The `sys.path.insert(0, ...)` in each test file ensures the `app` package is importable.\n\n**\u201cCORS error in browser\u201d**\nThe browser is blocking the request because the server\u2019s `allow_origins` doesn\u2019t include your frontend domain. For local development with the FastAPI docs, this shouldn\u2019t happen. If you\u2019re building a separate frontend, add its origin to `allow_origins`.\n\n**\u201cDatabase session not closed\u201d**\nThe `next(get_db())` pattern doesn\u2019t automatically close the session. In production, use a proper dependency injection pattern with `yield`:\n\n```python\ndef get_db():\n    db = SessionLocal()\n    try:\n        yield db\n    finally:\n        db.close()\n```\n\nAnd in the route:\n\n```python\n@router.post(\"/projects\")\ndef create_project(..., db: Session = Depends(get_db)):\n    ...\n```\n\n---\n\n## What comes next\n\nChapter 7 implements the fifteen agents. You\u2019ll create the BaseAgent class, implement each specialist, and wire them to the workflow service. By the end of Chapter 7, you\u2019ll have a complete, testable agent workforce.\n\nChapter 8 builds the workflow service that orchestrates the agents. You\u2019ll learn sequential, parallel, and conditional execution patterns, plus error handling and state management.\n\nThe API is the nervous system. The agents are the muscles. Next, we give them instructions.\n\n---\n\n*End of Chapter 6*\n"}, {"number": 7, "title": "Chapter 7: The 15-Agent Workforce", "content": "# Chapter 7: The 15-Agent Workforce\n\n*BaseAgent design, agent signatures, and the complete team roster from Product Director to Launch Strategist.*\n\n---\n\n## The BaseAgent contract\n\nEvery agent in the workforce inherits from a single `BaseAgent` class. This isn't premature abstraction \u2014 it's the contract that lets the workflow service treat all agents identically while each one does radically different work.\n\n```python\nclass BaseAgent:\n    name: str\n    version: str = \"1.0.0\"\n    \n    async def execute(self, context: AgentContext) -> AgentResult:\n        ...\n    \n    def validate_input(self, context: AgentContext) -> bool:\n        ...\n    \n    def rollback(self, context: AgentContext) -> None:\n        ...\n```\n\nThe `AgentContext` carries the project ID, current phase, accumulated artifacts from previous agents, and a reference to the database session. The `AgentResult` returns status, output artifacts, and any messages for the human-in-the-loop gate.\n\nThis uniform signature means the workflow service can dispatch any agent without knowing what it does internally. It also means you can swap a mock agent for a live one by changing a single configuration flag.\n\n## Why inheritance over composition\n\nYou might ask: why not use composition with dependency injection? The answer is pragmatism. Fifteen agents share 80% of their infrastructure \u2014 logging, error handling, database access, artifact storage. The base class handles that. The remaining 20% is the agent-specific logic that each subclass overrides.\n\nComposition would mean repeating the 80% in every agent. Inheritance lets you write it once and override the 20%. When you need a sixteenth agent, you subclass `BaseAgent` and fill in `execute()`.\n\n## The agent roster\n\n### 1. Product Director\n\nThe Product Director is the strategic brain. It takes a raw niche idea and shapes it into a product definition: target audience, core promise, unique angle, and success criteria.\n\n**Inputs:** Niche keyword, market category, author expertise level.\n**Outputs:** Product brief (JSON), audience persona, competitive positioning statement.\n**Failure mode:** Vague briefs that downstream agents can't act on. Mitigated by requiring structured output with mandatory fields.\n\n### 2. Market Researcher\n\nThe Market Researcher gathers intelligence. It queries public data sources, analyses competitor pricing, identifies content gaps, and estimates search volume for target keywords.\n\n**Inputs:** Product brief from the Director.\n**Outputs:** Market report with competitor matrix, pricing benchmarks, demand signals.\n**Failure mode:** Stale or hallucinated data. Mitigated by grounding queries in verifiable sources and caching results.\n\n### 3. Opportunity Scorer\n\nThe Opportunity Scorer turns research into a number. It weights demand, competition, monetisation fit, and author alignment to produce a score from 0 to 100.\n\n**Inputs:** Market report, product brief.\n**Outputs:** Opportunity score with component breakdown, go/no-go recommendation.\n**Failure mode:** False positives on saturated markets. Mitigated by configurable scoring weights per category.\n\n### 4. Positioning Strategist\n\nThe Positioning Strategist crafts the unique selling proposition. It finds the angle that differentiates this ebook from every competitor in the niche.\n\n**Inputs:** Product brief, market report, opportunity score.\n**Outputs:** Positioning statement, subtitle options, key differentiators.\n**Failure mode:** Generic positioning that could apply to any book. Mitigated by requiring specific competitor comparisons.\n\n### 5. Outline Architect\n\nThe Outline Architect designs the book's structure. It creates a hierarchical chapter and section blueprint that balances depth with readability.\n\n**Inputs:** Product brief, positioning statement, target page count.\n**Outputs:** Complete outline with chapter titles, section breakdowns, word count targets.\n**Failure mode:** Unbalanced chapters or missing logical flow. Mitigated by enforcing section count ranges and dependency ordering.\n\n### 6. Manuscript Author\n\nThe Manuscript Author writes the actual prose. It takes the outline and generates chapter-by-chapter content, maintaining voice consistency across the entire manuscript.\n\n**Inputs:** Outline, positioning statement, style guide.\n**Outputs:** Complete manuscript in markdown, chapter by chapter.\n**Failure mode:** Voice drift, repetition, factual errors. Mitigated by chapter-level context windows and editorial review loops.\n\n### 7. Editorial Agent\n\nThe Editorial Agent reviews the manuscript for structure, flow, grammar, and style. It doesn't rewrite \u2014 it annotates with specific revision suggestions.\n\n**Inputs:** Manuscript, style guide, outline.\n**Outputs:** Editorial report with line-numbered suggestions, priority ratings.\n**Failure mode:** Over-editing that strips the author's voice. Mitigated by configurable strictness levels.\n\n### 8. Fact-Check & Compliance Agent\n\nThe Fact-Check Agent verifies claims, statistics, and legal compliance. It flags anything that could be defamatory, copyright-infringing, or factually wrong.\n\n**Inputs:** Manuscript, niche category, jurisdiction (default: Australia).\n**Outputs:** Fact-check report with verified/unverified flags, compliance warnings.\n**Failure mode:** Missing niche-specific regulations. Mitigated by a compliance rulebook that can be updated per jurisdiction.\n\n### 9. Cover Creative Director\n\nThe Cover Creative Director generates the cover concept. It produces image prompts for the front cover, spine, and back cover, along with typography recommendations.\n\n**Inputs:** Product brief, positioning statement, target audience.\n**Outputs:** Cover brief with image prompts, colour palette, font pairings.\n**Failure mode:** Generic stock-photo aesthetics. Mitigated by requiring mood boards and style references.\n\n### 10. Ebook Production Agent\n\nThe Ebook Production Agent assembles the final files. It converts the markdown manuscript into EPUB and PDF formats, embeds metadata, and validates against publishing standards.\n\n**Inputs:** Final manuscript, cover assets, metadata (ISBN, publisher, author).\n**Outputs:** EPUB file, PDF file, validation report.\n**Failure mode:** Formatting errors in conversion. Mitigated by post-generation validation with industry tools.\n\n### 11. Sales Copywriter\n\nThe Sales Copywriter produces all the marketing text: Amazon description, landing page copy, email sequences, and social media snippets.\n\n**Inputs:** Product brief, positioning statement, target audience.\n**Outputs:** Sales page copy, Amazon description, email sequence (5 emails), social posts.\n**Failure mode:** Feature-focused copy instead of benefit-focused. Mitigated by requiring benefit-driven templates.\n\n### 12. Funnel & Fulfilment Agent\n\nThe Funnel Agent designs the purchase and delivery flow. It configures Stripe products, sets up webhook handlers, and defines the download delivery mechanism.\n\n**Inputs:** Product brief, pricing strategy, platform requirements.\n**Outputs:** Funnel diagram, Stripe product config, webhook handler map.\n**Failure mode:** Broken download links or expired tokens. Mitigated by tokenized URLs with configurable expiry.\n\n### 13. Analytics & Optimisation Agent\n\nThe Analytics Agent tracks performance. It monitors sales, conversion rates, refund rates, and customer feedback to identify optimisation opportunities.\n\n**Inputs:** Sales data, funnel metrics, customer feedback.\n**Outputs:** Analytics dashboard data, A/B test suggestions, optimisation recommendations.\n**Failure mode:** Vanity metrics that don't drive decisions. Mitigated by focusing on actionable KPIs.\n\n### 14. Obsidian Knowledge Manager\n\nThe Knowledge Manager publishes research, drafts, and reference material to the Obsidian vault. It maintains the knowledge graph that connects ideas across projects.\n\n**Inputs:** All artifacts from the current project, vault structure.\n**Outputs:** Vault notes with backlinks, tags, and metadata.\n**Failure mode:** Vault clutter from incomplete projects. Mitigated by only publishing on project completion.\n\n### 15. Launch Strategist\n\nThe Launch Strategist plans the go-to-market. It creates a timeline, identifies launch platforms, coordinates email sequences, and defines success milestones.\n\n**Inputs:** Product brief, sales copy, funnel config, analytics baseline.\n**Outputs:** Launch plan with timeline, platform checklist, milestone definitions.\n**Failure mode:** Launching before the product is ready. Mitigated by requiring all upstream artifacts before execution.\n\n## Wiring agents to the workflow\n\nEach agent is registered in the workflow service with its dependencies explicitly declared:\n\n```python\nagents = [\n    ProductDirector(),\n    MarketResearcher(),\n    OpportunityScorer(),\n    PositioningStrategist(),\n    OutlineArchitect(),\n    ManuscriptAuthor(),\n    EditorialAgent(),\n    FactCheckComplianceAgent(),\n    CoverCreativeDirector(),\n    EbookProductionAgent(),\n    SalesCopywriter(),\n    FulfilmentAgent(),\n    AnalyticsOptimisationAgent(),\n    ObsidianKnowledgeManager(),\n    LaunchStrategist(),\n]\n```\n\nThe workflow service resolves the dependency graph and executes agents in topological order. If the Manuscript Author fails, the Editorial Agent and Fact-Check Agent are skipped automatically \u2014 there's nothing to review.\n\n## Mock vs live execution\n\nEvery agent supports two modes:\n\n- **Mock mode:** Returns realistic synthetic output. Used for development, testing, and demonstrations without API costs.\n- **Live mode:** Calls external APIs (LLMs, search, Stripe) to produce real output.\n\nThe mode is controlled by a single environment variable per agent. This means you can develop the entire pipeline with mock agents, then flip individual agents to live as you're ready.\n\n## Error handling strategy\n\nAgents fail. The question is how gracefully. The workforce uses a three-tier approach:\n\n1. **Retry:** Transient failures (network timeouts, rate limits) are retried with exponential backoff.\n2. **Circuit breaker:** If an agent fails three times in a row, it's marked unhealthy and skipped for the rest of the pipeline run.\n3. **Human gate:** Critical failures (fact-check violations, compliance flags) pause the pipeline and wait for human approval before continuing.\n\nThis means a single agent failure doesn't kill the entire pipeline. You get as far as you can, fix the failure, and resume from where you left off.\n\n## Testing each agent\n\nEvery agent has unit tests that verify:\n\n- Input validation rejects malformed context.\n- Mock execution returns structurally valid output.\n- Live execution (when enabled) produces expected artifact types.\n- Rollback cleans up partial state on failure.\n\nThe test suite runs in under 30 seconds with all agents in mock mode. This is your safety net when modifying agent logic or adding new agents.\n\n## Adding a new agent\n\nTo add a 16th agent:\n\n1. Create `app/agents/my_new_agent.py` with a class inheriting `BaseAgent`.\n2. Implement `execute()`, `validate_input()`, and `rollback()`.\n3. Add the agent to the `agents` list in the workflow service.\n4. Write tests in `test_agents.py`.\n5. Run the full test suite to verify nothing broke.\n\nThe existing 15 agents serve as templates. Copy the structure, change the logic, and you're done. The workflow service automatically picks up the new agent and integrates it into the dependency graph.\n\n## Key takeaways\n\n- One base class, fifteen specialisations.\n- Uniform signatures enable generic workflow orchestration.\n- Mock mode for development, live mode for production.\n- Three-tier error handling: retry, circuit breaker, human gate.\n- Adding a new agent is a 5-step process with existing templates.\n\nYour workforce is now defined. Next: how the workflow service orchestrates these agents into an end-to-end pipeline.\n"}, {"number": 8, "title": "Chapter 8: The Service Layer", "content": "# Chapter 8: The Service Layer\n\n*From individual agents to an end-to-end pipeline \u2014 orchestration, state management, and error recovery.*\n\n---\n\n## The orchestration problem\n\nFifteen agents are useless if they can't work together. The service layer is what transforms a collection of independent specialists into a coherent production pipeline. It answers three questions:\n\n1. **Which agent runs next?**\n2. **What context does it receive?**\n3. **What happens when it fails?**\n\nThe `WorkflowService` class is the answer to all three.\n\n```python\nclass WorkflowService:\n    def __init__(self, session, agents: list[BaseAgent]):\n        self.session = session\n        self.agents = {a.name: a for a in agents}\n        self.graph = self._build_dependency_graph()\n    \n    async def run_full_pipeline(self, project_id: str) -> PipelineResult:\n        ...\n    \n    async def run_from(self, project_id: str, agent_name: str) -> PipelineResult:\n        ...\n```\n\n## The dependency graph\n\nEach agent declares what it needs from its predecessors. The service builds a directed acyclic graph from these declarations and executes in topological order.\n\n```\nProductDirector \u2192 MarketResearcher \u2192 OpportunityScorer \u2192 PositioningStrategist\n    \u2192 OutlineArchitect \u2192 ManuscriptAuthor \u2192 EditorialAgent \u2192 FactCheckComplianceAgent\n    \u2192 CoverCreativeDirector \u2192 EbookProductionAgent \u2192 SalesCopywriter\n    \u2192 FulfilmentAgent \u2192 AnalyticsOptimisationAgent \u2192 ObsidianKnowledgeManager\n    \u2192 LaunchStrategist\n```\n\nIf the Opportunity Scorer returns a \"no-go\" verdict, the pipeline stops. No point writing a book the market doesn't want.\n\n## Context accumulation\n\nEach agent receives the accumulated artifacts from all previous agents. The context object grows as the pipeline progresses:\n\n```python\n@dataclass\nclass AgentContext:\n    project_id: str\n    phase: str\n    artifacts: dict[str, Any]  # keyed by agent name\n    db_session: Session\n    config: PipelineConfig\n    human_approvals: list[ApprovalRecord]\n```\n\nEarly agents see a lean context. Later agents see the full history. The Manuscript Author doesn't need the Opportunity Score, but the Launch Strategist needs everything.\n\n## State management\n\nProjects move through well-defined states:\n\n```\nSCOPED \u2192 RESEARCHED \u2192 SCORED \u2192 POSITIONED \u2192 OUTLINED \u2192 DRAFTED \u2192 EDITED\n    \u2192 VERIFIED \u2192 PRODUCED \u2192 MARKETED \u2192 FULFILLED \u2192 ANALYSED \u2192 PUBLISHED \u2192 LAUNCHED\n```\n\nEach agent transition updates the project state in the database. If the pipeline crashes mid-execution, you can resume from the last completed state instead of starting over.\n\n```python\nasync def run_from(self, project_id: str, agent_name: str) -> PipelineResult:\n    current_state = await self._get_project_state(project_id)\n    start_index = self._state_index(agent_name)\n    \n    for agent in self._agents_from(start_index):\n        if await self._should_skip(project_id, agent):\n            continue\n        result = await self._execute_with_retry(agent, context)\n        if result.status == \"failed\":\n            await self._handle_failure(agent, result, context)\n            break\n        await self._advance_state(project_id, agent.name)\n```\n\n## Error handling in practice\n\nThe three-tier error handling from Chapter 7 plays out differently at the service level:\n\n### Tier 1: Retry with backoff\n\n```python\nasync def _execute_with_retry(self, agent, context, max_retries=3):\n    for attempt in range(max_retries):\n        try:\n            return await agent.execute(context)\n        except TransientError as e:\n            wait = 2 ** attempt\n            logger.warning(f\"{agent.name} failed (attempt {attempt+1}), retrying in {wait}s\")\n            await asyncio.sleep(wait)\n    return AgentResult(status=\"failed\", error=\"max_retries_exceeded\")\n```\n\nNetwork timeouts, rate limits, and temporary API outages trigger retries. The exponential backoff prevents thundering herd problems.\n\n### Tier 2: Circuit breaker\n\nIf an agent fails three times consecutively, the circuit breaker opens. The agent is marked unhealthy and skipped for the rest of the pipeline run. The project state is set to `BLOCKED` with a reference to the failing agent.\n\n```python\nclass CircuitBreaker:\n    def __init__(self, threshold=3):\n        self.failures: dict[str, int] = {}\n        self.threshold = threshold\n    \n    def record_failure(self, agent_name: str):\n        self.failures[agent_name] = self.failures.get(agent_name, 0) + 1\n    \n    def is_open(self, agent_name: str) -> bool:\n        return self.failures.get(agent_name, 0) >= self.threshold\n```\n\n### Tier 3: Human-in-the-loop\n\nSome failures aren't transient \u2014 they're fundamental. A fact-check violation, a compliance flag, or a positioning conflict requires human judgment. The pipeline pauses and creates an approval record:\n\n```python\n@dataclass\nclass ApprovalRecord:\n    agent_name: str\n    artifact_key: str\n    issue: str\n    options: list[str]\n    status: str = \"pending\"  # pending, approved, rejected\n    resolved_by: str | None = None\n    resolved_at: datetime | None = None\n```\n\nThe human reviews the issue, selects an option, and the pipeline resumes from where it left off.\n\n## Parallel execution\n\nSome agents have no dependencies on each other and can run concurrently. The service layer detects these opportunities:\n\n```python\n# Cover design and sales copy don't depend on each other\nparallel_group = [CoverCreativeDirector(), SalesCopywriter()]\nresults = await asyncio.gather(\n    *[self._execute_with_retry(a, context) for a in parallel_group],\n    return_exceptions=True\n)\n```\n\nThe Cover Creative Director and Sales Copywriter can work simultaneously because neither needs the other's output. This cuts total pipeline time by 15-20%.\n\n## Pipeline configuration\n\nNot every project needs every agent. The `PipelineConfig` lets you customise:\n\n```python\n@dataclass\nclass PipelineConfig:\n    skip_agents: list[str] = field(default_factory=list)\n    mock_agents: list[str] = field(default_factory=list)\n    human_gates: list[str] = field(default_factory=list)\n    max_retries: int = 3\n    parallel_groups: list[list[str]] = field(default_factory=list)\n    timeout_per_agent: int = 300  # seconds\n```\n\nA quick market validation might skip straight from Product Director to Opportunity Scorer. A full production run uses all fifteen agents. Same codebase, different configuration.\n\n## Observability\n\nThe service layer emits structured logs at every transition:\n\n```\n[INFO] Project abc123: ProductDirector completed in 12.3s\n[INFO] Project abc123: MarketResearcher completed in 45.1s\n[INFO] Project abc123: OpportunityScorer returned score 78/100 \u2014 GO\n[INFO] Project abc123: PositioningStrategist completed in 8.7s\n[WARN] Project abc123: ManuscriptAuthor attempt 1 failed \u2014 retrying in 2s\n[INFO] Project abc123: ManuscriptAuthor completed in 187.2s (attempt 2)\n```\n\nThese logs feed into the analytics agent and can be shipped to any structured logging platform. You always know exactly where a project stands.\n\n## Resuming interrupted pipelines\n\nIf the server crashes mid-pipeline, recovery is automatic:\n\n1. Query the database for projects in `IN_PROGRESS` or `BLOCKED` state.\n2. Identify the last completed agent for each project.\n3. Rebuild the context from accumulated artifacts.\n4. Resume from the next agent in the sequence.\n\nNo work is lost. The database is the source of truth, and artifacts are persisted after each agent completes.\n\n## Key takeaways\n\n- The service layer transforms independent agents into a coherent pipeline.\n- Dependency graph determines execution order; context accumulates as you go.\n- Three-tier error handling: retry, circuit breaker, human gate.\n- Parallel execution where dependencies allow.\n- Configurable pipeline \u2014 run all fifteen agents or just the ones you need.\n- Structured logging and state management enable automatic recovery.\n\nYour pipeline is now defined. Next: how market research and opportunity scoring actually work.\n"}, {"number": 9, "title": "Chapter 9: Market Research & Opportunity Scoring", "content": "# Chapter 9: Market Research & Opportunity Scoring\n\n*Niche identification, keyword analysis, competitor mapping, and the scoring algorithm that separates winners from distractions.*\n\n---\n\n## The research pipeline\n\nMarket research isn't a single step \u2014 it's a three-phase process that transforms a raw niche idea into a quantified opportunity.\n\n1. **Discovery:** Find related topics, sub-niches, and adjacent markets.\n2. **Analysis:** Map competitors, estimate demand, and identify content gaps.\n3. **Scoring:** Weight the factors that predict success and produce a clear go/no-go signal.\n\nThe Market Researcher handles phases 1-2. The Opportunity Scorer handles phase 3.\n\n## Phase 1: Discovery\n\nThe Market Researcher starts with a seed keyword from the Product Director's brief. It then expands outward using three techniques:\n\n### Keyword expansion\n\n```\nseed: \"native plant gardening australia\"\nexpanded: [\"australian native plants\", \"indigenous gardening\",\n           \"waterwise natives\", \"bush tucker garden\",\n           \"drought tolerant native garden\", \"local provenance plants\"]\n```\n\nThe researcher uses thesaurus relationships, search suggestion patterns, and category taxonomies to build the expansion list. In mock mode, it uses a curated niche ontology. In live mode, it queries keyword research APIs.\n\n### Adjacent niche discovery\n\nOnce the core keywords are identified, the researcher looks sideways. Who else is interested in native plant gardening, and what else do they buy?\n\n```\nadjacent: [\"sustainable landscaping\", \"wildlife gardening\",\n           \"organic vegetable growing\", \"permaculture design\",\n           \"heritage fruit trees\", \"no-dig gardening\"]\n```\n\nThis adjacent analysis reveals cross-selling opportunities and audience overlap that pure keyword research misses.\n\n### Seasonal pattern detection\n\nSome niches have strong seasonal demand. Gardening peaks in spring and autumn. Tax books peak in June-July. The researcher identifies these patterns so the launch strategist can time publication.\n\n## Phase 2: Analysis\n\nWith the niche landscape mapped, the researcher gathers data on each competitor and demand signal.\n\n### Competitor matrix\n\nFor each identified competitor, the researcher records:\n\n```python\n@dataclass\nclass Competitor:\n    title: str\n    author: str\n    platform: str  # Amazon, Gumroad, Kobo, etc.\n    price: float\n    rating: float\n    review_count: int\n    publication_date: date\n    page_count: int\n    content_quality: str  # assessed from reviews and previews\n    sales_estimate: int   # derived from review velocity\n    strengths: list[str]\n    weaknesses: list[str]\n```\n\nThe competitor matrix isn't just a list \u2014 it's a map. The researcher identifies clusters (many competitors at similar price points) and gaps (underserved topics or price ranges).\n\n### Demand signals\n\nDemand is estimated from three sources:\n\n1. **Search volume:** How many people search for these keywords monthly?\n2. **Social discussion:** What's the volume of conversation on Reddit, forums, and social platforms?\n3. **Competitor sales velocity:** How fast are existing books accumulating reviews?\n\nEach signal is normalised to a 0-100 scale and combined into a composite demand score.\n\n### Content gap analysis\n\nThe researcher identifies what competitors are missing:\n\n```\ngaps:\n  - topic: \"native plants for rental gardens\"\n    demand: medium\n    competition: none\n    rationale: \"Tenants can't plant in ground; pot-based native gardens are unserved\"\n  \n  - topic: \"indigenous fire-resistant landscaping\"\n    demand: growing\n    competition: low\n    rationale: \"Bushfire resilience is top-of-mind for Australian homeowners\"\n```\n\nThese gaps feed directly into the Positioning Strategist, who crafts the unique angle.\n\n## Phase 3: Scoring\n\nThe Opportunity Scorer takes the market research and produces a single number: the opportunity score. But that number is built from weighted components.\n\n### Scoring factors\n\n| Factor | Weight | Description |\n|--------|--------|-------------|\n| Demand | 25% | How many people want this? |\n| Competition | 20% | How hard is it to stand out? |\n| Monetisation | 20% | Will people pay, and how much? |\n| Author fit | 15% | Does the author have credibility? |\n| Timing | 10% | Is this niche rising or falling? |\n| Production feasibility | 10% | Can we produce this to a high standard? |\n\n### The scoring formula\n\n```python\ndef calculate_opportunity_score(research: MarketReport, author: AuthorProfile) -> OpportunityScore:\n    demand_score = normalise(research.demand_signals, max=100)\n    competition_score = 100 - normalise(research.competitor_density, max=100)  # inverted\n    monetisation_score = normalise(research.price_tiers, max=100)\n    author_fit_score = calculate_author_fit(research.topic, author.expertise)\n    timing_score = normalise(research.trend_velocity, max=100)\n    feasibility_score = estimate_feasibility(research.topic, research.required_depth)\n    \n    return OpportunityScore(\n        total=weighted_average([\n            (demand_score, 0.25),\n            (competition_score, 0.20),\n            (monetisation_score, 0.20),\n            (author_fit_score, 0.15),\n            (timing_score, 0.10),\n            (feasibility_score, 0.10),\n        ]),\n        components={\n            \"demand\": demand_score,\n            \"competition\": competition_score,\n            \"monetisation\": monetisation_score,\n            \"author_fit\": author_fit_score,\n            \"timing\": timing_score,\n            \"feasibility\": feasibility_score,\n        },\n        verdict=\"GO\" if total >= 60 else \"NO_GO\"\n    )\n```\n\n### The threshold\n\nA score of 60 or above is a GO. Below 60 is a NO_GO. This isn't arbitrary \u2014 it's calibrated against historical project outcomes. Books scoring above 60 consistently sell; books below 60 consistently stall.\n\nIf the score is below 60, the scorer identifies the weakest components. Maybe demand is high but author fit is low \u2014 in which case the project needs a co-author or a different topic. Maybe competition is the problem \u2014 in which case the positioning strategist needs a sharper angle.\n\n## Persisting research artifacts\n\nAll research artifacts are stored in the database with full provenance:\n\n```python\nclass ResearchArtifact(Base):\n    __tablename__ = \"research_artifacts\"\n    \n    id = Column(String, primary_key=True)\n    project_id = Column(String, ForeignKey(\"projects.id\"))\n    artifact_type = Column(String)  # \"competitor\", \"keyword\", \"gap\", \"signal\"\n    source = Column(str)           # \"mock\", \"google_trends\", \"reddit_api\", etc.\n    data = Column(JSON)            # The actual artifact data\n    confidence = Column(Float)     # 0.0 to 1.0, how much we trust this\n    retrieved_at = Column(DateTime, default=datetime.utcnow)\n```\n\nThe confidence field matters. Mock data has confidence 0.5. Verified data from authoritative sources has confidence 0.9+. When the Opportunity Scorer encounters conflicting signals, it weights by confidence.\n\n## Handling uncertainty\n\nResearch is never complete. The researcher flags uncertainty explicitly:\n\n```python\n@dataclass\nclass ResearchUncertainty:\n    field: str\n    reason: str\n    impact: str  # \"low\", \"medium\", \"high\"\n    resolution: str  # How to resolve: \"manual_research\", \"expert_consultation\", \"pilot_test\"\n```\n\nHigh-impact uncertainties trigger a human-in-the-loop gate before the pipeline continues. Better to pause and resolve than to build a book on shaky assumptions.\n\n## Key takeaways\n\n- Research is three-phase: discovery, analysis, scoring.\n- Competitor matrix reveals gaps, not just competitors.\n- Demand is multi-signal: search, social, sales velocity.\n- Opportunity score is weighted, transparent, and threshold-gated.\n- Confidence scoring separates verified data from estimates.\n- Uncertainty is flagged explicitly, not hidden.\n\nResearch is complete. Next: how the outline architect turns opportunity into structure.\n"}, {"number": 10, "title": "Chapter 10: Content Generation Pipeline", "content": "# Chapter 10: Content Generation Pipeline\n\n*Outline architecture, manuscript writing, editorial review loops, cover design, and ebook assembly.*\n\n---\n\n## The content generation challenge\n\nGenerating a 250-page ebook isn't a single prompt \u2014 it's a multi-stage process that balances creativity with consistency. The pipeline breaks down into five stages:\n\n1. **Outline** \u2014 hierarchical structure with word count targets\n2. **Drafting** \u2014 chapter-by-chapter manuscript generation\n3. **Editorial review** \u2014 structural and line-level feedback\n4. **Fact-checking** \u2014 claim verification and compliance\n5. **Production** \u2014 final formatting and assembly\n\nEach stage has its own agent, its own validation, and its own retry logic.\n\n## Outline architecture\n\nThe Outline Architect creates a three-level hierarchy:\n\n```\nBook (240 pages / 60,000 words)\n\u251c\u2500\u2500 Part 1: Foundations (60 pages / 15,000 words)\n\u2502   \u251c\u2500\u2500 Chapter 1: Why this matters (20 pages / 5,000 words)\n\u2502   \u2502   \u251c\u2500\u2500 Section 1.1: The problem (5 pages / 1,250 words)\n\u2502   \u2502   \u251c\u2500\u2500 Section 1.2: The opportunity (5 pages / 1,250 words)\n\u2502   \u2502   \u251c\u2500\u2500 Section 1.3: The evidence (5 pages / 1,250 words)\n\u2502   \u2502   \u2514\u2500\u2500 Section 1.4: Your action plan (5 pages / 1,250 words)\n\u2502   \u251c\u2500\u2500 Chapter 2: Core concepts (20 pages / 5,000 words)\n\u2502   \u2514\u2500\u2500 Chapter 3: First steps (20 pages / 5,000 words)\n\u251c\u2500\u2500 Part 2: Implementation (120 pages / 30,000 words)\n\u2502   \u2514\u2500\u2500 ...\n\u2514\u2500\u2500 Part 3: Mastery (60 pages / 15,000 words)\n    \u2514\u2500\u2500 ...\n```\n\nEach section has a purpose statement, a word count target, and cross-references to related sections. The outline isn't just a table of contents \u2014 it's a detailed brief for each writing assignment.\n\n### Balancing the outline\n\nThe architect enforces three balance rules:\n\n1. **Part balance:** No part exceeds 150% of any other part's word count.\n2. **Chapter balance:** Chapters within a part stay within 80-120% of the average chapter length for that part.\n3. **Pacing balance:** Action-oriented chapters alternate with concept-heavy chapters.\n\nThese rules prevent the common failure mode where the first half of the book is meticulous and the second half is rushed.\n\n## Manuscript generation\n\nThe Manuscript Author takes the outline and generates the actual content, one chapter at a time. It uses a sliding context window approach:\n\n### Chapter-level context\n\nFor each chapter, the author receives:\n\n- The complete outline (for overall structure)\n- The previous chapter's closing paragraphs (for voice continuity)\n- The current chapter's section breakdown (for detailed guidance)\n- All positioning and audience context (for tone consistency)\n\nThis context window is large enough for coherence but small enough to fit within token limits.\n\n### Voice consistency\n\nMaintaining a consistent voice across 60,000 words is harder than generating any single 5,000-word chapter. The author uses three techniques:\n\n1. **Style guide:** A concrete document that defines voice attributes (sentence length range, vocabulary level, humour frequency, formality level).\n2. **Anchor passages:** Three exemplar passages written during outline approval that define the target voice.\n3. **Recap prompts:** Each chapter prompt includes the closing paragraph of the previous chapter, grounding the voice in what came immediately before.\n\n### Handling facts and citations\n\nThe author doesn't make up statistics. Every factual claim is either:\n\n- Sourced from the research artifacts stored in the database\n- Flagged as `[CITATION NEEDED]` for the Fact-Check Agent to resolve\n- Presented as common knowledge that doesn't require citation\n\nThis keeps the author focused on prose and structure, leaving verification to the specialist.\n\n## Editorial review\n\nThe Editorial Agent reviews the manuscript in two passes:\n\n### Pass 1: Structural\n\nThe editor evaluates each chapter against its outline brief:\n\n- Does the chapter fulfill its stated purpose?\n- Is the section ordering logical?\n- Are there gaps where promised content is missing?\n- Is there redundancy with other chapters?\n\nStructural issues are returned as revision requests with specific section references.\n\n### Pass 2: Line-level\n\nThe editor reviews for:\n\n- Sentence-level clarity and flow\n- Grammar and punctuation\n- Consistent terminology (using a project glossary)\n- Active vs passive voice ratio\n- Paragraph length variation\n\nLine-level issues are returned as annotated suggestions, not rewrites. The author decides which suggestions to implement.\n\n### The revision loop\n\nIf either pass finds significant issues, the chapter enters a revision loop:\n\n```\nDraft \u2192 Structural review \u2192 Revision \u2192 Line-level review \u2192 Final\n```\n\nThe loop runs a maximum of three iterations. If the chapter still doesn't meet quality thresholds after three rounds, it's flagged for human review. In practice, most chapters converge on the first or second iteration.\n\n## Fact-checking and compliance\n\nThe Fact-Check Agent verifies three categories:\n\n### 1. Factual claims\n\nEvery statistic, date, name, and claim is checked against the research database. Claims without a supporting source are flagged with `[UNVERIFIED]`. The agent attempts to find sources; if it can't, the claim is either removed or attributed as \"industry estimate.\"\n\n### 2. Copyright and attribution\n\nThe agent checks all quotes, images, and data tables against copyright databases. Fair use is assessed on four factors: purpose, nature, amount, and market effect. Anything borderline is flagged for legal review.\n\n### 3. Compliance\n\nAustralian-specific compliance checks:\n\n- **Australian Consumer Law:** No misleading claims, no false testimonials\n- **Defamation:** No identifiable individuals portrayed negatively without evidence\n- **Financial advice:** No specific investment recommendations without appropriate disclaimers\n- **Health advice:** No specific medical claims without evidence and disclaimers\n\nCompliance failures block publication until resolved.\n\n## Cover design\n\nThe Cover Creative Director produces a cover brief, not the final image. The brief includes:\n\n### Visual direction\n\n- **Mood board:** Three to five reference images that capture the target aesthetic\n- **Colour palette:** Primary, secondary, and accent colours with hex codes\n- **Composition sketch:** Description of layout \u2014 image placement, title position, author name placement\n- **Typography:** Font pairings for title, subtitle, and author name with size ratios\n\n### Image prompts\n\nFor each surface (front cover, spine, back cover), the director produces a detailed image generation prompt:\n\n```\nFront cover prompt: \"A sunlit Australian native garden with flowering \ngrevilleas and bottlebrushes, shallow depth of field, golden hour lighting, \nwarm earth tones, professional garden photography style, 4:5 aspect ratio, \nno text\"\n```\n\n### Production-ready assets\n\nThe final cover is assembled from the generated image assets, typography, and barcode/ISBN block. The Production Agent handles this assembly.\n\n## Ebook production\n\nThe Ebook Production Agent takes the final manuscript and cover assets and produces the deliverable files:\n\n### EPUB generation\n\n1. Convert markdown to XHTML with semantic markup\n2. Apply CSS styles for typography and layout\n3. Embed cover image and metadata (title, author, ISBN, publisher)\n4. Generate table of contents (NCX and HTML)\n5. Validate against EPUB3 specification\n\n### PDF generation\n\n1. Convert markdown to PDF via print-ready styles\n2. Apply page layout (margins, headers, footers, page numbers)\n3. Embed fonts and images at print resolution (300dpi)\n4. Add cover as separate page\n5. Generate PDF/UA tags for accessibility\n\n### Quality validation\n\nBoth formats are validated:\n\n- **EPUB:** EPUBCheck validation, structure verification, link checking\n- **PDF:** PDF/A compliance, font embedding, image resolution, accessibility tags\n\nAny validation errors are reported with specific line numbers or element references for quick correction.\n\n## Key takeaways\n\n- Outline is a detailed brief, not just a table of contents.\n- Manuscript generation uses chapter-level context windows for voice consistency.\n- Editorial review is two-pass: structural, then line-level.\n- Fact-checking covers facts, copyright, and compliance.\n- Cover design produces a brief and prompts, not final images.\n- EPUB and PDF production includes validation against industry standards.\n\nContent is created. Next: how sales copy and funnel automation drive revenue.\n"}, {"number": 11, "title": "Chapter 11: Sales & Funnel Automation", "content": "# Chapter 11: Sales & Funnel Automation\n\n*Sales copy generation, Stripe product configuration, checkout flows, and webhook-driven fulfilment.*\n\n---\n\n## The revenue engine\n\nA book without sales is a hobby. The sales and funnel pipeline transforms a finished ebook into a revenue-generating product. This involves three components:\n\n1. **Sales copy** \u2014 the words that convince people to buy\n2. **Payment infrastructure** \u2014 the mechanism that processes transactions\n3. **Fulfilment** \u2014 the delivery mechanism that gets the book to the customer\n\nEach component is handled by a specialised agent, but they share a common goal: convert interest into payment into delivery with minimal friction.\n\n## Sales copy generation\n\nThe Sales Copywriter produces five distinct copy assets, each with a different purpose and audience:\n\n### 1. Landing page copy\n\nThe landing page is the primary sales tool. It follows the PASO framework:\n\n- **Problem:** Agitate the reader's pain point\n- **Agitate:** Show what's at stake if they don't solve it\n- **Solution:** Introduce the ebook as the answer\n- **Offer:** Present the specific deal (price, bonus, guarantee)\n\nThe copywriter generates:\n\n- Headline (3 variants)\n- Subheadline (2 variants)\n- Problem section (300-400 words)\n- Solution section (400-500 words)\n- Benefits bullet list (8-12 items)\n- Social proof placeholders (testimonials, download count, rating)\n- Call-to-action button text (3 variants)\n- FAQ section (5-8 questions with answers)\n- Money-back guarantee text\n\n### 2. Amazon description\n\nAmazon has different constraints than a landing page. The copywriter adapts:\n\n- HTML formatting allowed (bold, italics, bullet points)\n- No external links\n- Keyword-rich but natural-sounding\n- Starts with a hook, not a headline\n- Includes \"Readers also bought\" style cross-sells\n\n### 3. Email sequence\n\nA five-email launch sequence:\n\n| Email | Timing | Purpose |\n|-------|--------|---------|\n| 1 | Day 0 | Launch announcement \u2014 the book is live |\n| 2 | Day 2 | Problem agitation \u2014 why this matters to you |\n| 3 | Day 4 | Social proof \u2014 what readers are saying |\n| 4 | Day 6 | Objection handling \u2014 addressing hesitations |\n| 5 | Day 8 | Last chance \u2014 price increase or bonus expiry |\n\nEach email is 200-300 words, conversational, and includes a single clear CTA.\n\n### 4. Social media snippets\n\nPlatform-specific posts for launch promotion:\n\n- **Twitter/X:** 3 threads (10-15 tweets each) covering key insights from the book\n- **LinkedIn:** 2 long-form posts positioning the author as an expert\n- **Instagram:** 5 carousel post scripts with image descriptions\n- **Facebook:** 3 posts for relevant groups and pages\n\n### 5. Ad copy\n\nPaid advertising variants:\n\n- Facebook/Instagram: 5 headline variants, 5 primary text variants, 3 CTA variants\n- Google Ads: 3 responsive search ad variants (15 headlines, 4 descriptions each)\n\n## Stripe product configuration\n\nThe Fulfilment Agent configures the product in Stripe via the Stripe MCP server:\n\n### Product creation\n\n```python\nproduct = stripe.Product.create(\n    name=\"Fair Dinkum Native Gardening\",\n    description=\"The complete guide to Australian native plant gardening\",\n    metadata={\n        \"project_id\": \"abc123\",\n        \"format\": \"ebook\",\n        \"pages\": \"240\",\n        \"isbn\": \"978-0-XXXXXX-XX-X\"\n    }\n)\n```\n\n### Price tiers\n\nThree pricing tiers matching the trifecta-bro store model:\n\n| Tier | Type | Amount | Interval |\n|------|------|--------|----------|\n| Single Meet | One-time | $4.00 | \u2014 |\n| Weekly | Subscription | $9.00 | week |\n| Monthly | Subscription | $19.00 | month |\n\nEach price is created with the appropriate recurring or one-time configuration.\n\n### Checkout session generation\n\nFor one-time purchases:\n\n```python\nsession = stripe.checkout.Session.create(\n    mode=\"payment\",\n    success_url=\"https://fairdinkum.com/success?session_id={CHECKOUT_SESSION_ID}\",\n    cancel_url=\"https://fairdinkum.com/cancel\",\n    line_items=[{\"price\": price_id, \"quantity\": 1}],\n    metadata={\"project_id\": \"abc123\", \"tier\": \"single_meet\"}\n)\n```\n\nFor subscriptions:\n\n```python\nsession = stripe.checkout.Session.create(\n    mode=\"subscription\",\n    success_url=\"https://fairdinkum.com/welcome?session_id={CHECKOUT_SESSION_ID}\",\n    cancel_url=\"https://fairdinkum.com/cancel\",\n    line_items=[{\"price\": price_id, \"quantity\": 1}],\n    metadata={\"project_id\": \"abc123\", \"tier\": \"monthly\"},\n    subscription_data={\"trial_period_days\": 7}\n)\n```\n\n## Webhook handling\n\nThe fulfilment pipeline is driven by Stripe webhooks. The webhook handler processes four event types:\n\n### checkout.session.completed\n\nTriggered when a customer completes checkout. Actions:\n\n1. Verify the session metadata matches a valid project\n2. Generate a tokenized download URL (72-hour expiry)\n3. Send the download link to the customer's email\n4. Create a customer record in the local database\n5. Update the analytics agent with the sale event\n\n### invoice.payment_succeeded\n\nTriggered for subscription renewals. Actions:\n\n1. Verify the subscription is still active\n2. Generate a fresh download URL (new token, new expiry)\n3. Send the updated download link\n4. Record the recurring revenue event\n\n### customer.subscription.updated\n\nTriggered when a subscription changes (upgrade, downgrade, cancellation). Actions:\n\n1. Update the customer record with new tier information\n2. If upgraded: send new tier benefits and download links\n3. If downgraded: adjust access permissions\n4. If cancelled: schedule access revocation\n\n### customer.subscription.deleted\n\nTriggered when a subscription ends. Actions:\n\n1. Revoke download access\n2. Send a \"we're sorry to see you go\" email with re-offer\n3. Record churn reason if available\n4. Update analytics with churn event\n\n## Tokenized download delivery\n\nDownload security is critical \u2014 you don't want purchased books floating around the internet. The system uses tokenized URLs:\n\n### Token generation\n\n```python\ndef generate_download_token(customer_id: str, project_id: str) -> str:\n    payload = {\n        \"customer_id\": customer_id,\n        \"project_id\": project_id,\n        \"exp\": datetime.utcnow() + timedelta(hours=72),\n        \"jti\": str(uuid4())  # unique token ID for revocation\n    }\n    return jwt.encode(payload, SECRET_KEY, algorithm=\"HS256\")\n```\n\n### Token validation\n\n```python\ndef validate_download_token(token: str) -> DownloadClaim:\n    try:\n        payload = jwt.decode(token, SECRET_KEY, algorithms=[\"HS256\"])\n        if payload[\"exp\"] < datetime.utcnow():\n            raise TokenExpiredError()\n        if is_revoked(payload[\"jti\"]):\n            raise TokenRevokedError()\n        return DownloadClaim(**payload)\n    except jwt.InvalidTokenError:\n        raise InvalidTokenError()\n```\n\n### Delivery flow\n\n1. Customer clicks download link in email\n2. Server validates the token\n3. If valid: serve the file with appropriate headers (Content-Type, Content-Disposition)\n4. If expired: show a \"link expired\" page with a request-new-link option\n5. If revoked: show an \"access revoked\" page with support contact\n\n## Funnel analytics\n\nThe funnel agent tracks the complete customer journey:\n\n```\nImpression \u2192 Landing page view \u2192 Add to cart \u2192 Checkout started \u2192 Payment completed \u2192 Download\n```\n\nEach stage is tracked with:\n\n- **Count:** How many people reached this stage\n- **Conversion rate:** Percentage who moved to the next stage\n- **Drop-off rate:** Percentage who left at this stage\n- **Time to conversion:** How long from first impression to purchase\n\nThis data feeds directly into the Analytics Agent's optimisation recommendations.\n\n## Key takeaways\n\n- Sales copy is five assets: landing page, Amazon, email sequence, social, ads.\n- Stripe products match the three-tier model: single, weekly, monthly.\n- Webhooks drive the entire fulfilment pipeline.\n- Tokenized downloads with 72-hour expiry balance security with usability.\n- Funnel analytics track every stage from impression to download.\n\nSales infrastructure is ready. Next: analytics, optimisation, and launch strategy.\n"}, {"number": 12, "title": "Chapter 12: Analytics & Launch", "content": "# Chapter 12: Analytics & Launch\n\n*Revenue tracking, A/B testing, platform selection, timing, and the go-to-market playbook.*\n\n---\n\n## The measurement problem\n\nWhat you don't measure, you can't improve. But not all metrics are created equal. Vanity metrics (page views, social followers) feel good but don't drive decisions. Actionable metrics (conversion rate, revenue per customer, churn rate) tell you exactly what to do next.\n\nThe Analytics Agent focuses exclusively on actionable metrics.\n\n## Revenue tracking\n\nThree revenue metrics matter at different stages:\n\n### 1. Gross Revenue\n\nThe total money coming in before any costs. Tracked daily, weekly, monthly.\n\n```\nDaily:    $147\nWeekly:   $892\nMonthly:  $3,247\nYTD:      $18,430\n```\n\n### 2. Net Revenue\n\nGross revenue minus refunds, chargebacks, and Stripe fees. This is the number that matters for sustainability.\n\n```\nGross:     $3,247\nRefunds:   -$97 (3.0%)\nChargebacks: -$49 (1.5%)\nStripe fees: -$187 (5.8%)\nNet:       $2,914\n```\n\n### 3. Revenue per Customer (RPC)\n\nTotal revenue divided by unique customers. Tells you the lifetime value trajectory.\n\n```\nSingle Meet buyers:  $4.00 RPC\nWeekly subscribers:  $27.00 RPC (average 3 weeks retained)\nMonthly subscribers: $57.00 RPC (average 3 months retained)\n```\n\n## Churn analysis\n\nFor subscription products, churn is the silent killer. The Analytics Agent tracks three churn metrics:\n\n### Gross churn\n\nPercentage of subscribers who cancel in a given period.\n\n```\nMonth 1: 45% (typical \u2014 trial users who don't convert)\nMonth 2: 15% (stabilising base)\nMonth 3: 8%  (loyal core emerging)\nMonth 4+: 5% (mature retention)\n```\n\n### Net churn\n\nGross churn minus upgrades and reactivations. Can be negative if upgrades exceed cancellations.\n\n```\nGross churn:     -$340/month\nUpgrades:        +$120/month\nReactivations:   +$60/month\nNet churn:       -$160/month \u2190 healthy trajectory\n```\n\n### Cohort retention\n\nTracking when customers leave reveals patterns:\n\n```\nCohort        Month 1  Month 2  Month 3  Month 4\nJan 2026       100%     55%      42%      35%\nFeb 2026       100%     58%      48%      \u2014\nMar 2026       100%     62%      \u2014        \u2014\nApr 2026       100%     \u2014        \u2014        \u2014\n```\n\nIf Month 2 retention is improving month-over-month, your product is getting stickier.\n\n## A/B testing\n\nThe Analytics Agent designs and evaluates A/B tests across the funnel:\n\n### Test categories\n\n1. **Headline tests:** Which landing page headline produces the highest conversion rate?\n2. **Price tests:** Does $4.99 convert better than $3.99 or $5.99?\n3. **Copy tests:** Does a problem-first or solution-first landing page convert better?\n4. **Email tests:** Which subject line produces the highest open rate?\n5. **CTA tests:** \"Buy Now\" vs \"Get Instant Access\" vs \"Download Now\"\n\n### Test design\n\nEvery test needs:\n\n- **Hypothesis:** \"Changing X will increase Y by Z%\"\n- **Control:** The current version\n- **Variant:** The proposed change\n- **Sample size:** Minimum 100 conversions per variant for statistical significance\n- **Duration:** Minimum 7 days to capture weekday/weekend variation\n- **Success metric:** The single number that determines the winner\n\n### Test results\n\nThe agent produces a test report with:\n\n```\nTest: Landing page headline\nControl: \"The Complete Guide to Native Plant Gardening\"\nVariant: \"Grow a Native Garden That Thrives on Neglect\"\n\nResults:\n  Control:   423 visitors, 31 conversions (7.3%)\n  Variant:   418 visitors, 47 conversions (11.2%)\n  \n  Lift: +53.4%\n  Confidence: 95.2%\n  Recommendation: Ship the variant\n```\n\n## Platform selection\n\nNot all sales platforms are equal. The Launch Strategist evaluates:\n\n### Primary platforms\n\n| Platform | Revenue share | Audience size | Control |\n|----------|---------------|---------------|---------|\n| Own website (Stripe) | 100% - fees | Your traffic | Full |\n| Amazon KDP | 35-65% | Massive | Limited |\n| Gumroad | 10% growing | Creator-focused | Moderate |\n| Payhip | 5%+ | Small | Good |\n| Apple Books | 30% | Apple ecosystem | Limited |\n\n### Recommended launch sequence\n\n1. **Day 1-7:** Launch on own website (highest margin, full control)\n2. **Day 8-14:** Expand to Gumroad (creator audience, easy setup)\n3. **Day 15-30:** Publish on Amazon KDP (massive audience, lower margin)\n4. **Day 31+:** Evaluate Apple Books, Kobo, Google Play\n\nThis sequence maximises revenue early while building toward maximum reach.\n\n## Timing\n\nLaunch timing affects initial momentum, which affects platform algorithms, which affects long-term sales.\n\n### Weekday patterns\n\n```\nBest days to launch: Tuesday, Wednesday, Thursday\nBest days to send email: Tuesday, Thursday\nWorst days: Friday afternoon, Saturday, Sunday\n```\n\n### Seasonal patterns\n\nFor a gardening ebook:\n\n```\nPeak: March-May (autumn planting), September-November (spring planting)\nTrough: June-August (winter), December-January (summer heat)\n```\n\n### Industry events\n\nLaunch alongside relevant events:\n\n- Australian Garden Show Sydney (March)\n- Melbourne International Flower and Garden Show (March-April)\n- Gardening Australia Ferepo (anytime \u2014 align with TV seasons)\n\n## Launch playbook\n\nThe Launch Strategist produces a 30-day plan:\n\n### Pre-launch (Days -14 to 0)\n\n- [ ] Landing page live with email capture\n- [ ] Free chapter opt-in magnet active\n- [ ] Beta reader testimonials collected\n- [ ] Email sequence loaded and tested\n- [ ] Social media accounts primed with pre-launch content\n\n### Launch week (Days 1-7
