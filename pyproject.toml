[project]
name = "fair-dinkum-publishing-agent-workflowz"
version = "0.1.0"
description = "Fair Dinkum Publishing Agent Workforce — FastAPI MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "httpx>=0.25.0",
    "stripe>=7.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "fastapi[all]>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "alembic>=1.12.0",
    "httpx>=0.25.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "stripe>=7.0.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "app.api:app"
